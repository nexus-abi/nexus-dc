name: Build Android APK
on:
  push:
    branches: [main, master]
    paths-ignore: ['www/**', 'backend/**', 'tests/**', 'docs/**', '*.md', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install packages
        run: npm install
      - name: Point the app at the live UI (GitHub Pages)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          URL="https://${OWNER}.github.io/${{ github.event.repository.name }}/"
          node -e "const f='capacitor.config.json',c=require('./'+f);c.server.url='$URL';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          echo "App loads UI from $URL"
      - name: Create Android project
        run: npx cap add android
      - name: Apply icons and permissions
        run: python3 scripts/prep_android.py
      - name: Copy web files into app
        run: npx cap sync android
      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NexusDocs.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NexusDocs-APK
          path: NexusDocs.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Nexus Docs APK #${{ github.run_number }}
          files: NexusDocs.apk
