name: Deploy app UI (GitHub Pages)
on:
  push:
    branches: [main, master]
    paths: ['www/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp app version (commit id)
        run: |
          V=$(git rev-parse --short=8 HEAD)
          MSG=$(git log -1 --pretty=%s | head -c 140)
          sed -i "s/__APP_VERSION__/$V/g" www/index.html
          grep -q "APP_VER = '$V'" www/index.html || { echo "Version stamp failed"; exit 1; }
          # new cache name on every deploy so the service worker never serves old files
          [ -f www/sw.js ] && sed -i "s/const V = 'nexus-[^']*'/const V = 'nexus-$V'/" www/sw.js || true
          jq -n --arg v "$V" --arg m "$MSG" --arg t "$(date -u +%FT%TZ)" '{v:$v,msg:$m,time:$t}' > www/version.json
          cat www/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: d
        uses: actions/deploy-pages@v4
