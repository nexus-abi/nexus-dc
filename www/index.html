  <style>
    :root {
      --bg: #f4f6fb;
      --sf: #fff;
      --tx: #0f1b3d;
      --t2: #6a7592;
      --ac: #3b5bfd;
      --bd: #e6eaf4;
      --ok: #12a150;
      --wn: #e08a00;
      --er: #e5484d;
      --sh: 0 1px 2px #1b2a6b0d, 0 8px 24px #1b2a6b10;
      --g: linear-gradient(135deg, #0f1b3d, #2d4bf0 75%, #7c3aed);
      --hd: #0f1b3d;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px)
    }

    [data-t=dark] {
      --bg: #080d1a;
      --sf: #111a2e;
      --tx: #eef2ff;
      --t2: #8d9bbd;
      --bd: #1f2b47;
      --sh: 0 8px 24px #0006;
      --hd: #0a1124
    }

    * {
      box-sizing: border-box
    }

    html {
      -webkit-text-size-adjust: 100%;
      overscroll-behavior-y: contain
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--tx);
      -webkit-tap-highlight-color: transparent;
      line-height: 1.4
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer;
      border: 0;
      background: none;
      padding: 0
    }

    a {
      color: var(--ac);
      cursor: pointer;
      font-weight: 600
    }

    small,
    .t2 {
      color: var(--t2)
    }

    h1,
    h2,
    h3,
    p {
      margin: 0
    }

    .i {
      flex: none;
      display: block
    }

    /* splash */
    #sp {
      position: fixed;
      inset: 0;
      background: var(--g);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      z-index: 300;
      transition: opacity .45s;
      color: #fff
    }

    #sp .lg {
      width: 72px;
      height: 72px;
      font-size: 34px;
      border-radius: 22px;
      animation: pl 1.4s infinite
    }

    #sp b {
      font-size: 20px;
      letter-spacing: .3px
    }

    #sp .bar {
      width: 140px;
      height: 4px;
      border-radius: 4px;
      background: #ffffff33;
      overflow: hidden
    }

    #sp .bar:after {
      content: "";
      display: block;
      height: 100%;
      width: 40%;
      background: #fff;
      border-radius: 4px;
      animation: ld 1.1s infinite ease-in-out
    }

    @keyframes pl {
      50% {
        transform: scale(1.07)
      }
    }

    @keyframes ld {
      0% {
        margin-left: -40%
      }

      100% {
        margin-left: 100%
      }
    }

    .lg {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #ffffff26;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 21px;
      color: #fff;
      flex: none
    }

    .lg.sm {
      width: 34px;
      height: 34px;
      font-size: 16px;
      border-radius: 11px;
      background: var(--g)
    }

    /* base ui */
    .card {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--sh)
    }

    .fld {
      position: relative;
      margin-bottom: 12px
    }

    .fld>.i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--t2);
      pointer-events: none
    }

    .fld input {
      padding-left: 44px
    }

    .fld .eye {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: var(--t2)
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 12px;
      border: 1.5px solid var(--bd);
      border-radius: 12px;
      background: var(--bg);
      outline: 0;
      transition: border-color .15s, box-shadow .15s
    }

    .fld input {
      margin: 0
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--ac);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--ac) 12%, transparent)
    }

    .lb {
      font-size: 12px;
      font-weight: 600;
      color: var(--t2);
      display: block;
      margin: 0 0 5px
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 20px;
      border-radius: 12px;
      background: var(--g);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 6px 16px color-mix(in srgb, var(--ac) 27%, transparent);
      transition: transform .1s, opacity .15s
    }

    .btn:active {
      transform: scale(.97)
    }

    .btn.full {
      width: 100%
    }

    .btn+.btn.full {
      margin-top: 10px
    }

    .btn.sec {
      background: var(--bg);
      color: var(--tx);
      box-shadow: none;
      border: 1.5px solid var(--bd)
    }

    .btn.dg {
      background: var(--er);
      box-shadow: 0 6px 16px #e5484d44
    }

    .btn.sm {
      padding: 9px 14px;
      font-size: 14px;
      border-radius: 10px
    }

    /* auth */
    .split {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh
    }

    .brand {
      background: var(--g);
      color: #fff;
      padding: calc(28px + var(--sat)) 24px 28px
    }

    .brand h1 {
      margin: 14px 0 6px;
      font-size: 26px
    }

    .brand p {
      opacity: .85
    }

    .brand ul {
      list-style: none;
      padding: 0;
      margin: 26px 0 0;
      display: none;
      gap: 14px;
      flex-direction: column
    }

    .brand li {
      display: flex;
      gap: 12px;
      align-items: center
    }

    .brand li .i {
      background: #ffffff22;
      padding: 8px;
      border-radius: 10px;
      width: 36px;
      height: 36px
    }

    .fm {
      display: grid;
      place-items: center;
      padding: 20px
    }

    .auth {
      width: 100%;
      max-width: 400px
    }

    .auth h1 {
      font-size: 24px;
      margin-bottom: 4px
    }

    .auth>p {
      color: var(--t2);
      margin-bottom: 18px
    }

    .sub {
      text-align: center;
      margin-top: 16px;
      color: var(--t2);
      font-size: 14px;
      line-height: 2
    }

    @media(min-width:900px) {
      .split {
        grid-template-columns: 1.1fr 1fr
      }

      .brand {
        padding: 60px;
        display: flex;
        flex-direction: column;
        justify-content: center
      }

      .brand h1 {
        font-size: 40px
      }

      .brand ul {
        display: flex
      }
    }

    /* shell */
    #shell {
      display: none
    }

    #shell.on {
      display: block
    }

    .side {
      display: none
    }

    .col {
      min-width: 0
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px 16px calc(120px + var(--sab));
      animation: fi .25s
    }

    @keyframes fi {
      from {
        opacity: 0;
        transform: translateY(6px)
      }
    }

    .tb {
      position: sticky;
      top: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: calc(10px + var(--sat)) 16px 10px;
      background: var(--hd);
      color: #fff;
      box-shadow: 0 2px 12px #0003
    }

    .tb .ib {
      background: #ffffff1f;
      color: #fff
    }

    .tb b {
      flex: 1
    }

    .tabs {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: var(--sf);
      border-top: 1px solid var(--bd);
      padding: 8px 6px calc(8px + var(--sab));
      z-index: 20
    }

    .tabs button,
    .side nav button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      color: var(--t2);
      font-weight: 600;
      padding: 4px 12px
    }

    .tabs button.on,
    .side button.on {
      color: var(--ac)
    }

    .tabs .plus {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--g);
      color: #fff;
      margin-top: -26px;
      box-shadow: 0 8px 18px color-mix(in srgb, var(--ac) 40%, transparent);
      justify-content: center;
      padding: 0
    }

    @media(min-width:900px) {
      #shell.on {
        display: grid;
        grid-template-columns: 250px 1fr
      }

      .tabs,
      .tb {
        display: none
      }

      main {
        width: 100%;
        max-width: 880px;
        padding: 32px
      }

      .side {
        display: flex;
        flex-direction: column;
        gap: 6px;
        position: sticky;
        top: 0;
        height: 100vh;
        padding: 24px 14px;
        background: var(--sf);
        border-right: 1px solid var(--bd)
      }

      .side .lg {
        background: var(--g)
      }

      .side nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 18px
      }

      .side nav button {
        flex-direction: row;
        gap: 12px;
        font-size: 15px;
        padding: 12px 14px;
        border-radius: 12px;
        width: 100%
      }

      .side nav button:hover {
        background: var(--bg)
      }

      .side nav button.on {
        background: color-mix(in srgb, var(--ac) 9%, transparent)
      }

      .side .add {
        margin-top: 14px
      }

      .side .me {
        margin-top: auto;
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px;
        border-radius: 14px;
        border: 1px solid var(--bd);
        text-align: left;
        width: 100%
      }

      .side .me div {
        min-width: 0
      }

      .side .me b,
      .side .me small {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px
      }
    }

    /* avatar */
    .av {
      border-radius: 50%;
      background: var(--g);
      color: #fff;
      font-weight: 800;
      display: grid;
      place-items: center;
      object-fit: cover;
      flex: none;
      width: 42px;
      height: 42px;
      font-size: 17px
    }

    .av.sm {
      width: 34px;
      height: 34px;
      font-size: 14px
    }

    .av.lg {
      width: 64px;
      height: 64px;
      font-size: 26px;
      border: 2px solid #fff6
    }

    .av.xl {
      width: 104px;
      height: 104px;
      font-size: 42px;
      border: 4px solid var(--sf);
      box-shadow: var(--sh)
    }

    /* pages */
    .ph {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px
    }

    .ph h2 {
      font-size: 24px
    }

    .h {
      margin: 24px 0 10px;
      font-size: 13px;
      color: var(--t2);
      text-transform: uppercase;
      letter-spacing: .7px;
      font-weight: 700
    }

    .hero {
      background: var(--g);
      color: #fff;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 12px 28px color-mix(in srgb, var(--ac) 27%, transparent);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 16px;
      justify-content: space-between
    }

    .hero:after {
      content: "";
      position: absolute;
      right: -40px;
      top: -50px;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: #ffffff14;
      pointer-events: none
    }

    .hero small {
      color: #ffffffb3
    }

    .hero h2 {
      font-size: 26px;
      margin: 2px 0 6px
    }

    .hero p {
      opacity: .9;
      font-size: 14px
    }

    .hero button {
      position: relative;
      z-index: 1
    }

    .hero.vh {
      justify-content: flex-start
    }

    .hero.vh img {
      width: 84px;
      height: 84px;
      border-radius: 16px;
      object-fit: cover;
      border: 2px solid #fff6;
      cursor: pointer
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(78px, 1fr));
      gap: 10px;
      margin: 14px 0
    }

    .st {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 16px;
      padding: 14px 8px;
      text-align: center;
      box-shadow: var(--sh)
    }

    .st b {
      font-size: 24px;
      display: block
    }

    .st small {
      font-size: 12px
    }

    .st.wn b {
      color: var(--wn)
    }

    .st.er b {
      color: var(--er)
    }

    .qa {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 14px 0
    }

    .qa button {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 16px;
      padding: 16px 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      box-shadow: var(--sh);
      color: var(--ac);
      transition: transform .1s
    }

    .qa button:active {
      transform: scale(.96)
    }

    .qa span {
      font-size: 12px;
      font-weight: 600;
      color: var(--tx)
    }

    .dc,
    .vc {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      margin-bottom: 10px;
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 16px;
      cursor: pointer;
      box-shadow: var(--sh);
      transition: transform .12s, border-color .15s
    }

    .dc:hover,
    .vc:hover {
      border-color: var(--ac)
    }

    .dc:active,
    .vc:active {
      transform: scale(.99)
    }

    .ic,
    .vp {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: color-mix(in srgb, var(--ac) 9%, transparent);
      color: var(--ac);
      display: grid;
      place-items: center;
      flex: none
    }

    .ic.er {
      background: #e5484d1f;
      color: var(--er)
    }

    .ic.wn {
      background: #e08a001f;
      color: var(--wn)
    }

    .ic.ok {
      background: #12a1501f;
      color: var(--ok)
    }

    .vp {
      width: 60px;
      height: 60px;
      object-fit: cover
    }

    .in {
      flex: 1;
      min-width: 0
    }

    .in b {
      display: block
    }

    .in small {
      display: block;
      margin: 2px 0 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .rt {
      text-align: right;
      font-size: 12px;
      color: var(--t2);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px
    }

    .ib {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--bg);
      display: grid;
      place-items: center
    }

    .ch {
      color: var(--t2)
    }

    .bd {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
      display: inline-block;
      background: var(--bg);
      color: var(--t2)
    }

    .er {
      color: var(--er);
      background: #e5484d1f
    }

    .wn {
      color: var(--wn);
      background: #e08a001f
    }

    .ok {
      color: var(--ok);
      background: #12a1501f
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin: 0 0 12px;
      padding-bottom: 2px
    }

    .chip {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1.5px solid var(--bd);
      background: var(--sf);
      white-space: nowrap;
      font-weight: 600;
      font-size: 14px
    }

    .chip.on {
      background: var(--ac);
      color: #fff;
      border-color: var(--ac)
    }

    .srch {
      position: relative
    }

    .srch .i {
      position: absolute;
      left: 14px;
      top: 14px;
      color: var(--t2)
    }

    .srch input {
      padding-left: 44px
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .empty {
      text-align: center;
      color: var(--t2);
      padding: 34px 10px;
      border: 2px dashed var(--bd);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px
    }

    .bk {
      color: var(--ac);
      font-weight: 700;
      margin-bottom: 12px;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 4px
    }

    .sk {
      background: linear-gradient(90deg, var(--bd), var(--bg), var(--bd));
      background-size: 200% 100%;
      animation: sh 1.2s infinite;
      border-radius: 16px
    }

    @keyframes sh {
      to {
        background-position: -200% 0
      }
    }

    /* profile */
    .cover {
      height: 120px;
      border-radius: 22px 22px 0 0;
      background: var(--g);
      position: relative;
      overflow: hidden
    }

    .cover:after {
      content: "";
      position: absolute;
      right: -30px;
      top: -60px;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: #ffffff14
    }

    .pfc {
      padding: 0;
      overflow: hidden
    }

    .pfh {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 14px;
      padding: 0 20px 20px;
      margin-top: -52px
    }

    .avw {
      position: relative;
      border-radius: 50%
    }

    .cam {
      position: absolute;
      right: 2px;
      bottom: 4px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--ac);
      color: #fff;
      display: grid;
      place-items: center;
      border: 3px solid var(--sf)
    }

    .pfi {
      flex: 1;
      min-width: 160px;
      padding-top: 56px
    }

    .pfi h2 {
      font-size: 22px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap
    }

    .pfi small {
      display: block
    }

    .vb {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      color: var(--ok);
      background: #12a1501f;
      padding: 3px 9px;
      border-radius: 12px
    }

    .pg2 {
      height: 8px;
      border-radius: 8px;
      background: var(--bg);
      overflow: hidden;
      margin: 10px 0 8px
    }

    .pg2 i {
      display: block;
      height: 100%;
      background: var(--g);
      border-radius: 8px;
      transition: width .6s
    }

    .grp {
      padding: 6px 18px
    }

    .row {
      display: flex;
      gap: 14px;
      align-items: center;
      width: 100%;
      padding: 14px 0;
      border-bottom: 1px solid var(--bd);
      text-align: left
    }

    .grp>.row:last-child {
      border: 0
    }

    .ri {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--ac) 8%, transparent);
      color: var(--ac);
      display: grid;
      place-items: center;
      flex: none
    }

    .row.rd .ri {
      background: #e5484d1a;
      color: var(--er)
    }

    .row.rd b {
      color: var(--er)
    }

    .rb {
      flex: 1;
      min-width: 0
    }

    .rb b {
      display: block;
      font-size: 15px;
      font-weight: 600;
      overflow-wrap: anywhere
    }

    .rb small {
      display: block;
      font-size: 12.5px
    }

    .rb i {
      color: var(--t2);
      font-weight: 400;
      font-style: normal
    }

    .sw {
      position: relative;
      width: 48px;
      height: 28px;
      flex: none
    }

    .sw input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
      z-index: 1
    }

    .sw span {
      position: absolute;
      inset: 0;
      background: var(--bd);
      border-radius: 20px;
      transition: .2s
    }

    .sw span:after {
      content: "";
      position: absolute;
      left: 3px;
      top: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px #0004;
      transition: .2s
    }

    .sw input:checked+span {
      background: var(--ac)
    }

    .sw input:checked+span:after {
      transform: translateX(20px)
    }

    /* forms in modal */
    .seg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--bg);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 12px
    }

    .seg button {
      padding: 10px;
      border-radius: 9px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--t2)
    }

    .seg .on {
      background: var(--sf);
      color: var(--ac);
      box-shadow: var(--sh)
    }

    .drop {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
      padding: 18px;
      border: 2px dashed var(--ac);
      border-radius: 14px;
      color: var(--ac);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin: 2px 0 10px;
      background: color-mix(in srgb, var(--ac) 5%, transparent)
    }

    .drop.dg {
      background: color-mix(in srgb, var(--ac) 13%, transparent)
    }

    .fi {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      background: var(--bg);
      border-radius: 10px;
      margin-bottom: 6px;
      font-size: 14px
    }

    .fi span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: flex;
      gap: 8px;
      align-items: center
    }

    .fi button {
      color: var(--er)
    }

    .pv {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 12px
    }

    .pv img,
    .pv .vp {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      object-fit: cover
    }

    /* custom modal / sheet / toast / loader */
    .ov {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #050a1a99;
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      transition: opacity .2s
    }

    .ov.on {
      opacity: 1
    }

    .md {
      width: 100%;
      max-width: 440px;
      max-height: calc(100dvh - 32px);
      display: flex;
      flex-direction: column;
      background: var(--sf);
      border-radius: 22px;
      box-shadow: 0 24px 60px #0007;
      transform: translateY(18px) scale(.97);
      transition: transform .25s cubic-bezier(.2, .9, .3, 1.15)
    }

    .ov.on .md {
      transform: none
    }

    .md.wide {
      max-width: 560px
    }

    .mh {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 20px 6px
    }

    .mh h3 {
      flex: 1;
      font-size: 19px;
      overflow-wrap: anywhere
    }

    .mi {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--ac) 9%, transparent);
      color: var(--ac);
      display: grid;
      place-items: center;
      flex: none
    }

    .mi.er {
      background: #e5484d1f;
      color: var(--er)
    }

    .mi.wn {
      background: #e08a001f;
      color: var(--wn)
    }

    .mx {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: var(--t2)
    }

    .mx:hover {
      background: var(--bg)
    }

    .mb {
      padding: 10px 20px;
      overflow: auto;
      -webkit-overflow-scrolling: touch
    }

    .mb p.mt {
      color: var(--t2);
      line-height: 1.6
    }

    .me {
      display: none;
      margin: 2px 0 6px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #e5484d1a;
      color: var(--er);
      font-size: 13.5px;
      font-weight: 600
    }

    .me.on {
      display: block
    }

    .mf {
      display: flex;
      gap: 10px;
      padding: 12px 20px 20px
    }

    .mf .btn {
      flex: 1;
      margin: 0
    }

    .sl {
      display: flex;
      flex-direction: column;
      padding-bottom: 12px
    }

    .si {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 6px;
      border-radius: 12px;
      text-align: left;
      width: 100%
    }

    .si:hover {
      background: var(--bg)
    }

    .si .i {
      color: var(--ac)
    }

    .si span {
      flex: 1
    }

    .si b {
      display: block;
      font-weight: 600
    }

    .si small {
      display: block;
      font-size: 12.5px
    }

    .si.rd,
    .si.rd .i {
      color: var(--er)
    }

    @media(max-width:600px) {
      .ov {
        align-items: flex-end;
        padding: 0
      }

      .md,
      .md.wide {
        max-width: none;
        border-radius: 22px 22px 0 0;
        transform: translateY(100%);
        max-height: 92dvh
      }

      .mf {
        padding-bottom: calc(20px + var(--sab))
      }
    }

    #ts {
      position: fixed;
      z-index: 200;
      left: 50%;
      transform: translateX(-50%);
      top: calc(14px + var(--sat));
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: calc(100% - 28px);
      max-width: 420px;
      pointer-events: none
    }

    .to {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 14px;
      background: var(--tx);
      color: var(--bg);
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 10px 30px #0004;
      opacity: 0;
      transform: translateY(-14px);
      transition: .28s
    }

    .to.in {
      opacity: 1;
      transform: none
    }

    .to.ok .i {
      color: #4ade80
    }

    .to.er .i {
      color: #ff8b8f
    }

    .to.inf .i {
      color: #8aa4ff
    }

    .ld {
      position: fixed;
      inset: 0;
      z-index: 150;
      background: #050a1a80;
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s
    }

    .ld.on {
      opacity: 1;
      pointer-events: auto
    }

    .lc {
      background: var(--sf);
      border-radius: 20px;
      padding: 26px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 20px 50px #0006;
      min-width: 190px
    }

    .sp {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 4px solid var(--bd);
      border-top-color: var(--ac);
      animation: sn .8s linear infinite
    }

    @keyframes sn {
      to {
        transform: rotate(360deg)
      }
    }

    /* viewer */
    #vw {
      position: fixed;
      inset: 0;
      background: #05080f;
      z-index: 50;
      display: none;
      flex-direction: column;
      padding-bottom: var(--sab)
    }

    #vw.on {
      display: flex
    }

    #vw nav {
      height: calc(56px + var(--sat));
      display: flex;
      align-items: center;
      gap: 10px;
      padding: var(--sat) 12px 0;
      color: #fff;
      flex: none
    }

    #vw nav b {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis
    }

    #vw nav button,
    #vw nav a {
      background: #ffffff1f;
      color: #fff;
      border: 0;
      padding: 8px 14px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px
    }

    #zc {
      flex: 1;
      overflow: hidden;
      display: grid;
      place-items: center;
      touch-action: none;
      min-height: 0
    }

    #zc img {
      max-width: 100%;
      max-height: 100%
    }

    #zc iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff
    }

    .pg {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      padding: 12px;
      color: #fff;
      flex: none
    }

    .pg button {
      background: #ffffff1f;
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center
    }

    .star {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: var(--t2);
      background: var(--bg)
    }

    .star.on {
      color: #f5a623
    }

    .star.on svg {
      fill: #f5a623
    }

    .off {
      background: var(--wn);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
      display: none
    }

    .off.on {
      display: inline-block
    }

    .lgi {
      display: block;
      border-radius: 11px;
      flex: none
    }

    .ban {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 16px;
      background: var(--sf);
      border: 1.5px solid var(--ac);
      box-shadow: var(--sh)
    }

    .ban img {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      flex: none
    }

    .ban .in small {
      margin: 2px 0 0
    }

    .cks {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px
    }

    .ck {
      position: relative
    }

    .ck input {
      position: absolute;
      opacity: 0;
      margin: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: pointer
    }

    .ck span {
      display: block;
      text-align: center;
      padding: 11px 4px;
      border: 1.5px solid var(--bd);
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      background: var(--bg)
    }

    .ck input:checked+span {
      background: var(--ac);
      border-color: var(--ac);
      color: #fff
    }

    .sws {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 4px 0 10px
    }

    .sws button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid var(--sf);
      box-shadow: 0 0 0 2px var(--bd);
      display: grid;
      place-items: center;
      color: #fff
    }

    .sws button.on {
      box-shadow: 0 0 0 3px var(--tx)
    }

    #lk {
      position: fixed;
      inset: 0;
      z-index: 400;
      background: var(--g);
      color: #fff;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: calc(24px + var(--sat)) 24px calc(24px + var(--sab));
      user-select: none
    }

    #lk.on {
      display: flex
    }

    .dots {
      display: flex;
      gap: 16px;
      margin: 8px 0 12px
    }

    .dots i {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #fff;
      display: block
    }

    .dots i.f {
      background: #fff
    }

    .pad {
      display: grid;
      grid-template-columns: repeat(3, 72px);
      gap: 14px
    }

    .pad button {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #ffffff22;
      color: #fff;
      font-size: 26px;
      font-weight: 600;
      display: grid;
      place-items: center
    }

    .pad button:active {
      background: #ffffff4d
    }

    .shake {
      animation: shk .35s
    }

    @keyframes shk {
      25% {
        transform: translateX(-10px)
      }

      75% {
        transform: translateX(10px)
      }
    }
    /* ---- v3: pull to refresh, front/back slots ---- */
    #ptr {
      position: fixed;
      top: calc(var(--sat) + 56px);
      left: 50%;
      width: 40px;
      height: 40px;
      margin-left: -20px;
      border-radius: 50%;
      background: var(--sf);
      color: var(--ac);
      box-shadow: var(--sh);
      display: grid;
      place-items: center;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-60px)
    }

    .slots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px
    }

    .slot {
      position: relative;
      min-height: 124px;
      border: 2px dashed var(--ac);
      border-radius: 14px;
      background: color-mix(in srgb, var(--ac) 5%, transparent);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 28px 8px 10px;
      overflow: hidden
    }

    .slot.has {
      border-style: solid;
      padding: 0;
      background: var(--bg)
    }

    .slot img {
      width: 100%;
      height: 124px;
      object-fit: cover;
      display: block
    }

    .slot .pdf {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 28px 10px 10px;
      color: var(--t2);
      max-width: 100%
    }

    .slot .pdf small {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .sl-l {
      position: absolute;
      top: 8px;
      left: 10px;
      font-size: 12px;
      font-weight: 800;
      color: var(--ac);
      z-index: 1
    }

    .slot.has .sl-l {
      background: var(--ac);
      color: #fff;
      padding: 2px 9px;
      border-radius: 10px;
      top: 8px;
      left: 8px
    }

    .sl-b {
      display: flex;
      gap: 8px
    }

    .sl-b button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 14px;
      border-radius: 10px;
      background: var(--sf);
      color: var(--ac);
      font-size: 12px;
      font-weight: 700;
      box-shadow: var(--sh)
    }

    .sl-x {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #000a;
      color: #fff;
      display: grid;
      place-items: center;
      z-index: 2
    }

    .pgb {
      display: flex;
      gap: 8px;
      margin-bottom: 10px
    }

    .pgb button {
      flex: 1;
      white-space: nowrap;
      padding-left: 8px;
      padding-right: 8px
    }

    .two > * {
      min-width: 0
    }

    input[type=date] {
      min-width: 0;
      max-width: 100%
    }
    /* ---------- v3.1 password vault ---------- */
    .tabs button { padding: 4px 8px }
    .vav { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; flex: none; color: #fff; font-weight: 800; font-size: 19px }
    .vtag { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; background: color-mix(in srgb, var(--ac) 10%, transparent); color: var(--ac) }
    .vqa { display: flex; gap: 6px; flex: none }
    .vib { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; flex: none; color: var(--t2); background: var(--bg); border: 1px solid var(--bd) }
    .vib:active { transform: scale(.94) }
    .vlock { text-align: center; padding: 34px 22px }
    .vlock .big { width: 76px; height: 76px; border-radius: 24px; background: var(--g); color: #fff; display: grid; place-items: center; margin: 0 auto 16px; box-shadow: 0 10px 24px color-mix(in srgb, var(--ac) 35%, transparent) }
    .vlock h3 { margin: 0 0 6px; font-size: 20px }
    .vlock p { color: var(--t2); margin: 0 0 16px; line-height: 1.5 }
    .vlock ul { text-align: left; color: var(--t2); padding-left: 20px; margin: 0 0 20px; line-height: 1.7; font-size: 14px }
    .vrow { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--bd) }
    .vrow .rb b.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .4px }
    .vact { display: flex; gap: 8px; margin-top: 14px }
    .vact .btn { flex: 1; padding: 10px 8px }
    .vmeta { font-size: 12px; color: var(--t2); margin: 14px 0 0; line-height: 1.6 }
    .vmeta.wn { color: var(--wn) }
    .vmeter { height: 5px; border-radius: 3px; background: var(--bd); overflow: hidden; margin: -4px 0 4px }
    .vmeter i { display: block; height: 100%; width: 0; transition: width .2s, background .2s }
    .vml { font-size: 12px; color: var(--t2); display: block; margin-bottom: 10px; min-height: 16px }
    .vgen { margin: 0 0 12px }
    .cf { display: grid; grid-template-columns: 1fr 1fr 36px 36px; gap: 6px; margin-bottom: 8px; align-items: center }
    .cf input { margin: 0; padding: 10px 11px; font-size: 14px }
    .vpre { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 4px }
    .vpre button { padding: 6px 11px; border-radius: 16px; border: 1.5px dashed var(--bd); font-size: 12.5px; font-weight: 600; color: var(--t2) }

    /* =====================================================================
       v6 DESIGN LAYER: tinted canvas, big rounded tiles, stacked nav, display type.
       Everything is driven by variables so the Appearance screen can restyle the app.
       ===================================================================== */
    :root {
      --bg: color-mix(in srgb, var(--ac) 5%, #f4f5f9);
      --sf: #ffffff;
      --tx: #10131c;
      --t2: #646e84;
      --bd: #e5e8f0;
      --hd: #0d1120;
      --ok: #0e9f6e;
      --wn: #d97706;
      --er: #e0364a;
      --fd: "Bricolage Grotesque", "Figtree", Inter, system-ui, sans-serif;
      --fb: Figtree, Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --sh: 0 1px 2px #10142010, 0 12px 28px -16px #1014203a;
      --sh2: 0 24px 56px -20px #10142066, 0 4px 12px #1014201a;
      --rc: 26px; --rt: 28px; --rb: 999px; --ri: 16px; --rm: 30px; --rs: 14px; --rq: 19px;
      --zm: 1;
      color-scheme: light
    }

    [data-t=dark] {
      --bg: #0a0c12;
      --sf: #141821;
      --tx: #f2f4fa;
      --t2: #8f99ae;
      --bd: #232938;
      --hd: #0a0d18;
      --sh: 0 1px 0 #ffffff08 inset;
      --sh2: 0 24px 56px -20px #000d, 0 4px 14px #0008;
      color-scheme: dark
    }

    [data-t=dark][data-b="1"] { --bg: #000; --sf: #0c0d11; --bd: #1b1d25; --hd: #000 }
    [data-r=soft] { --rc: 18px; --rt: 20px; --rb: 14px; --ri: 12px; --rm: 22px; --rs: 11px; --rq: 14px }
    [data-r=sharp] { --rc: 8px; --rt: 10px; --rb: 8px; --ri: 8px; --rm: 12px; --rs: 8px; --rq: 10px }
    [data-f=system] { --fd: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --fb: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif }
    [data-f=classic] { --fd: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif }

    body { font-family: var(--fb); font-size: 15.5px; line-height: 1.45; -webkit-font-smoothing: antialiased }
    main { zoom: var(--zm) }
    h1, h2, h3 { font-family: var(--fd); letter-spacing: -.03em; font-weight: 700 }
    b { font-weight: 650 }
    :focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; border-radius: 10px }
    input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 0 }

    /* ---- controls ---- */
    .card { border: 0; border-radius: var(--rc); padding: 20px; box-shadow: var(--sh) }
    input, select, textarea { background: color-mix(in srgb, var(--tx) 5%, var(--sf)); border: 1.5px solid transparent; border-radius: var(--ri); padding: 14px 16px }
    input:hover, select:hover, textarea:hover { background: color-mix(in srgb, var(--tx) 7%, var(--sf)) }
    input:focus, select:focus, textarea:focus { background: var(--sf); border-color: var(--ac); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ac) 16%, transparent) }
    input[type=file] { padding: 9px 10px; font-size: 14px; color: var(--t2) }
    input[type=file]::file-selector-button { margin-right: 12px; border: 0; border-radius: var(--rb); padding: 9px 16px; background: var(--ac); color: #fff; font: inherit; font-size: 14px; font-weight: 650; cursor: pointer }
    input[type=range] { padding: 0; height: 28px; background: none; border: 0; accent-color: var(--ac) }
    input[type=color] { padding: 4px; height: 48px; cursor: pointer }
    .lb { font-size: 13px; font-weight: 650; color: var(--t2); margin-bottom: 6px }
    .btn { border-radius: var(--rb); background: var(--ac); padding: 14px 24px; font-weight: 650; letter-spacing: -.005em; box-shadow: 0 14px 24px -14px color-mix(in srgb, var(--ac) 90%, #000) }
    .btn:hover { filter: brightness(1.07) }
    .btn.sm { padding: 9px 17px }
    .btn.sec { background: color-mix(in srgb, var(--tx) 7%, transparent); color: var(--tx); border: 0; box-shadow: none }
    .btn.sec:hover { filter: none; background: color-mix(in srgb, var(--tx) 11%, transparent) }
    .btn.dg { background: var(--er); box-shadow: 0 14px 24px -14px var(--er) }
    .ib, .star { border-radius: 50%; background: color-mix(in srgb, var(--tx) 7%, transparent); border: 0; width: 36px; height: 36px }
    .chips { gap: 8px; margin-bottom: 14px }
    .chip { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: var(--rb); background: var(--sf); box-shadow: var(--sh); padding: 9px 17px; font-weight: 650; font-size: 14px }
    .chip.on { background: var(--tx); color: var(--bg) }
    .seg { background: color-mix(in srgb, var(--tx) 7%, transparent); border-radius: var(--rb) }
    .seg.c3 { grid-template-columns: repeat(3, 1fr) }
    .seg.c4 { grid-template-columns: repeat(4, 1fr) }
    .seg button { border-radius: var(--rb); font-size: 14px }
    .seg .on { background: var(--sf); color: var(--tx); box-shadow: var(--sh) }
    .bd { border-radius: var(--rb); padding: 4px 11px; font-weight: 650; font-size: 12.5px; display: inline-flex; align-items: center }
    .bd.er::before, .bd.wn::before, .bd.ok::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 6px }
    .er { background: color-mix(in srgb, var(--er) 13%, transparent) }
    .wn { background: color-mix(in srgb, var(--wn) 15%, transparent) }
    .ok { background: color-mix(in srgb, var(--ok) 13%, transparent) }
    .vb, .vtag { border-radius: var(--rb) }
    .empty { border: 2px dashed var(--bd); border-radius: var(--rc); background: transparent }
    .bk { font-weight: 650 }
    .two { gap: 12px }

    /* ---- sign in / splash / pin lock ---- */
    #sp, #lk { background: radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--ac) 60%, #0b0e1a), #0b0e1a 70%) }
    .brand { background: color-mix(in srgb, var(--ac) 11%, var(--bg)); color: var(--tx); padding-bottom: 34px }
    .brand h1 { font-family: var(--fd); font-size: 40px; line-height: .98; letter-spacing: -.05em; font-weight: 750; margin-top: 22px }
    .brand p { opacity: 1; color: var(--t2); font-size: 16px; max-width: 30ch }
    .brand .lg, .brand .lgi { background: var(--ac); border-radius: 18px; border: 0 }
    .brand li .i { background: var(--sf); color: var(--ac); border-radius: 12px }
    .auth h1 { font-size: 32px; letter-spacing: -.045em; font-weight: 750 }
    @media(min-width:900px) { .brand h1 { font-size: 64px } .brand { padding: 72px } }

    /* ---- top cap: stays dark so the Android status icons stay readable ---- */
    .tb { background: var(--hd); border-radius: 0 0 var(--rc) var(--rc); box-shadow: none; padding-bottom: 14px }
    .tb b { font-family: var(--fd); font-size: 19px; letter-spacing: -.035em; font-weight: 700 }
    .tb .ib { background: #ffffff1a; color: #fff }

    /* ---- bottom navigation: five equal slots, active slot gets a pill, + floats on the right ---- */
    .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; left: 0; right: 0; bottom: 0; max-width: none; margin: 0; border: 0; border-radius: var(--rc) var(--rc) 0 0; background: var(--sf); box-shadow: 0 -14px 34px -16px #10142030; padding: 8px 8px calc(8px + var(--sab)) }
    .tabs button { position: relative; flex-direction: column; justify-content: flex-start; align-items: center; gap: 3px; padding: 8px 0 6px; font-size: 11px; font-weight: 650; color: var(--t2); border-radius: var(--rs); transition: color .2s }
    .tabs button span { display: block; font-size: 11px; font-weight: 650; letter-spacing: .005em }
    .tabs button .i { position: relative; z-index: 1 }
    .tabs button::before { content: ""; position: absolute; top: 4px; left: 50%; width: 56px; height: 32px; margin-left: -28px; border-radius: var(--rb); background: color-mix(in srgb, var(--ac) 15%, transparent); opacity: 0; transform: scaleX(.4); transition: opacity .2s, transform .25s }
    .tabs button.on { color: var(--ac) }
    .tabs button.on::before { opacity: 1; transform: none }
    .tabs .plus { position: absolute; right: 16px; top: -74px; width: 58px; height: 58px; padding: 0; border-radius: var(--rq); background: var(--ac); color: #fff; margin: 0; border: 0; justify-content: center; box-shadow: 0 18px 30px -12px color-mix(in srgb, var(--ac) 90%, #000), 0 2px 6px #10142030 }
    .tabs .plus::before { display: none }

    /* ---- desktop sidebar ---- */
    .side { background: var(--sf); border-right: 0; box-shadow: 1px 0 0 var(--bd) }
    .side nav button { border-radius: var(--rb); font-weight: 650; font-size: 15px }
    .side nav button.on { background: color-mix(in srgb, var(--ac) 13%, transparent); color: var(--ac) }
    .side nav button::before { display: none }
    .side .me { color: var(--tx); font-size: 14px; font-weight: 600; background: var(--bg); border: 0; border-radius: var(--rc) }
    .side .me small { color: var(--t2); font-weight: 500 }

    /* ---- page titles ---- */
    .ph { gap: 12px }
    .ph h2 { font-size: 36px; letter-spacing: -.05em; font-weight: 750; min-width: 0; overflow-wrap: anywhere }
    .h { font-family: var(--fd); font-size: 19px; font-weight: 650; letter-spacing: -.03em; color: var(--tx); text-transform: none; margin: 28px 0 12px }

    /* ---- home: greeting + bento tiles ---- */
    .gh { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 6px 0 20px }
    .gh small { font-size: 15px; color: var(--t2); font-weight: 500 }
    .gh h2 { font-size: 38px; line-height: 1; letter-spacing: -.055em; font-weight: 750; margin-top: 4px }
    .bento { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px }
    .bt { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; min-height: 124px; padding: 16px 18px; border-radius: var(--rt); background: var(--sf); box-shadow: var(--sh); text-align: left }
    .bt b { font-family: var(--fd); font-size: 46px; line-height: .95; letter-spacing: -.06em; font-weight: 750 }
    .bt small { font-size: 13.5px; font-weight: 650; color: var(--t2) }
    .bt .ti { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--sf) 70%, transparent) }
    .bt.ta { background: color-mix(in srgb, var(--ac) 13%, var(--sf)) }
    .bt.ta .ti { color: var(--ac) }
    .bt.tb2 { background: color-mix(in srgb, #0ea5a4 14%, var(--sf)) }
    .bt.tb2 .ti { color: #0b8e8d }
    .bt.tw { background: color-mix(in srgb, var(--wn) 15%, var(--sf)) }
    .bt.tw .ti, .bt.tw b { color: var(--wn) }
    .bt.te { background: color-mix(in srgb, var(--er) 13%, var(--sf)) }
    .bt.te .ti, .bt.te b { color: var(--er) }
    .bt.big { grid-column: 1/-1; min-height: 168px; color: #fff; cursor: pointer; background: linear-gradient(150deg, var(--ac), color-mix(in srgb, var(--ac) 62%, #070a18)); box-shadow: 0 26px 40px -24px color-mix(in srgb, var(--ac) 85%, #000) }
    .bt.big::after { content: ""; position: absolute; right: -46px; top: -46px; width: 190px; height: 190px; border-radius: 50%; border: 30px solid #ffffff17; pointer-events: none }
    .bt.big::before { content: ""; position: absolute; right: 26px; top: 26px; width: 58px; height: 58px; border-radius: 50%; border: 12px solid #ffffff12; pointer-events: none }
    .bt.big b { font-size: 84px; color: #fff; letter-spacing: -.07em }
    .bt.big small { color: #ffffffd0; font-size: 14.5px }
    .bt.big p { color: #ffffffe0; font-size: 14px; margin-top: 4px; max-width: 90% }
    .bt.big.good { background: linear-gradient(150deg, var(--ok), color-mix(in srgb, var(--ok) 60%, #04120b)) }
    @media(min-width:900px) { .bento { grid-template-columns: repeat(4, 1fr) } .bt.big { min-height: 190px } }

    /* quick actions: one scrolling row of pills */
    .qa { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 6px; padding: 4px 16px 10px; scrollbar-width: none }
    .qa::-webkit-scrollbar { display: none }
    .qa button { flex: none; flex-direction: row; gap: 8px; padding: 11px 17px; border: 0; border-radius: var(--rb); background: var(--sf); box-shadow: 0 1px 2px #10142018; color: var(--ac); transition: transform .1s }
    .qa button .i { width: 18px; height: 18px }
    .qa span { font-size: 14px; font-weight: 650; color: var(--tx); white-space: nowrap }
    @media(min-width:900px) { .qa { margin: 0 0 6px; padding: 4px 0 10px; flex-wrap: wrap } }
    /* vehicle page actions: three equal buttons */
    .hero.vh + .qa { display: grid; grid-template-columns: repeat(3, 1fr); overflow: visible; margin: 12px 0 4px; padding: 0 }
    .hero.vh + .qa button { flex-direction: column; justify-content: center; gap: 6px; padding: 14px 4px; border-radius: var(--rc) }
    .hero.vh + .qa .i { width: 22px; height: 22px }
    .hero.vh + .qa span { font-size: 13px }

    /* summary tiles on the profile page */
    .stats { gap: 10px }
    .st { border: 0; border-radius: var(--rq); padding: 16px 6px 14px; box-shadow: var(--sh); background: var(--sf); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px }
    .st b { font-family: var(--fd); font-size: 32px; letter-spacing: -.06em; font-weight: 750; line-height: 1 }
    .st small { font-size: 12.5px; font-weight: 600; margin: 0; display: block; line-height: 1.2; min-height: 2.4em }
    .st.wn, .st.er, .st.ok { background: var(--sf) }

    /* ---- document and vehicle cards: tinted by status ---- */
    .dc, .vc { border: 0; border-radius: var(--rc); padding: 14px 16px 14px 14px; gap: 14px; box-shadow: var(--sh); transition: transform .15s, box-shadow .15s }
    .dc:hover, .vc:hover { transform: translateY(-1px); box-shadow: var(--sh2) }
    .dc[data-s=er] { background: color-mix(in srgb, var(--er) 8%, var(--sf)) }
    .dc[data-s=wn] { background: color-mix(in srgb, var(--wn) 9%, var(--sf)) }
    [data-card=plain] .dc[data-s] { background: var(--sf) }
    .ic, .vp { width: 54px; height: 54px; border-radius: var(--rq); background: color-mix(in srgb, var(--ac) 14%, var(--sf)) }
    .ic.er { background: color-mix(in srgb, var(--er) 16%, var(--sf)) }
    .ic.wn { background: color-mix(in srgb, var(--wn) 18%, var(--sf)) }
    .ic.ok { background: color-mix(in srgb, var(--ok) 15%, var(--sf)) }
    .vp { width: 62px; height: 62px }
    .in b { font-family: var(--fd); font-size: 17px; letter-spacing: -.025em; font-weight: 650 }
    .in small { font-size: 13.5px; margin: 3px 0 7px }
    .rt { font-size: 12px; font-weight: 600 }
    [data-d=compact] .dc, [data-d=compact] .vc { padding: 9px 12px 9px 10px; gap: 11px; margin-bottom: 7px }
    [data-d=compact] .ic, [data-d=compact] .vp { width: 44px; height: 44px }
    [data-d=compact] .in small { margin: 1px 0 4px }
    [data-d=compact] .bt { min-height: 100px; padding: 13px 15px }
    [data-d=compact] .bt.big { min-height: 140px }
    [data-d=compact] .h { margin: 20px 0 8px }
    [data-d=compact] .card { padding: 15px }
    [data-d=compact] .row { padding: 9px 0 }

    /* hero (vehicle details) and profile */
    .hero { border-radius: var(--rt); box-shadow: 0 26px 40px -26px color-mix(in srgb, var(--ac) 85%, #000) }
    .hero h2 { font-size: 30px; letter-spacing: -.05em }
    .hero .btn { background: #fff; color: #10131c; box-shadow: none }
    .cover { border-radius: var(--rc) var(--rc) 0 0 }
    .pfc, .card.pfc { border-radius: var(--rc); padding: 0 }
    .pfh { flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 0 20px 22px; margin-top: -58px }
    .pfi { padding-top: 0; min-width: 0; width: 100% }
    .pfi h2 { justify-content: center; font-size: 24px }
    .pfi small { margin-top: 2px }
    .avw { margin: 0 auto }
    .pg2 { height: 8px }

    /* settings rows */
    .grp { padding: 4px 18px }
    .row { padding: 14px 0 }
    .ri { border-radius: var(--rs); background: color-mix(in srgb, var(--ac) 12%, var(--sf)) }
    .row.rd .ri { background: color-mix(in srgb, var(--er) 14%, var(--sf)) }
    .sw span { background: color-mix(in srgb, var(--tx) 18%, var(--bg)) }
    .sw input:checked + span { background: var(--ac) }

    /* upload */
    .drop, .slot { border-radius: var(--rq); border-width: 1.5px }
    .slot.has { border-color: var(--bd) }
    .sl-b button { border-radius: var(--rb) }
    .fi { border-radius: var(--rs) }
    .ck span { border: 0; border-radius: var(--rs); background: color-mix(in srgb, var(--tx) 6%, var(--sf)) }
    .pv { align-items: center }

    /* ---- sheets, dialogs, toast ---- */
    .ov { background: #070a14a8; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px) }
    .md { border-radius: var(--rm); box-shadow: var(--sh2) }
    .mh h3 { font-size: 21px; letter-spacing: -.04em }
    .mi { border-radius: var(--rs); background: color-mix(in srgb, var(--ac) 13%, var(--sf)) }
    .mi.er { background: color-mix(in srgb, var(--er) 14%, var(--sf)) }
    .mi.wn { background: color-mix(in srgb, var(--wn) 16%, var(--sf)) }
    .mx { border-radius: 50%; background: color-mix(in srgb, var(--tx) 7%, transparent) }
    .me { border-radius: var(--rs); background: color-mix(in srgb, var(--er) 11%, transparent) }
    .si { border-radius: var(--rq) }
    #ts { top: calc(var(--sat) + 78px); z-index: 500 }
    .to { border-radius: var(--rb); padding: 12px 20px; border: 1px solid color-mix(in srgb, var(--bg) 22%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ac) 28%, transparent), var(--sh2) }
    .lc { border-radius: var(--rc); box-shadow: var(--sh2) }
    @media(min-width:900px) { #ts { top: 22px } }
    @media(max-width:600px) {
      .md, .md.wide { border-radius: var(--rm) var(--rm) 0 0 }
      .md::before { content: ""; flex: none; width: 42px; height: 5px; border-radius: 5px; background: color-mix(in srgb, var(--tx) 16%, transparent); margin: 10px auto 0 }
    }

    /* ---- vault ---- */
    .vlock .big { border-radius: var(--rt); background: linear-gradient(150deg, var(--ac), color-mix(in srgb, var(--ac) 62%, #070a18)) }
    .vav { border-radius: var(--rq) }
    .vib { border-radius: 50%; border: 0; background: color-mix(in srgb, var(--tx) 7%, transparent) }
    .ban { border: 0; border-radius: var(--rq); box-shadow: var(--sh), 0 0 0 1.5px color-mix(in srgb, var(--ac) 50%, transparent) }
    .pad button { background: #ffffff1c; border: 0 }
    .vmeta { font-size: 12.5px; margin: 16px 0 0 }
    .vmeta.wn { background: color-mix(in srgb, var(--wn) 12%, transparent); padding: 10px 12px; border-radius: var(--rs) }
    #vw nav button, #vw nav a { border-radius: var(--rb) }
    .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 4px }
    .ftile { position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; min-height: 128px; padding: 16px; border-radius: var(--rt); text-align: left; background: color-mix(in srgb, var(--c) 13%, var(--sf)); box-shadow: var(--sh); overflow: hidden; transition: transform .12s }
    .ftile:active { transform: scale(.97) }
    .ftile .vav { position: absolute; top: 14px; left: 14px; width: 42px; height: 42px; border-radius: var(--rs); background: var(--c); font-family: var(--fd) }
    .ftile b { font-family: var(--fd); font-size: 18px; letter-spacing: -.03em; font-weight: 700; overflow-wrap: anywhere }
    .ftile small { font-size: 13px; font-weight: 600; color: var(--t2) }
    .ftile.new { background: transparent; border: 2px dashed var(--bd); box-shadow: none; color: var(--ac); align-items: flex-start; justify-content: center; gap: 4px }
    .ftile.new b { color: var(--tx); font-size: 16px }
    .vtag.vf { background: color-mix(in srgb, var(--tx) 7%, transparent); color: var(--t2) }
    .vtag.vf .i { display: inline; vertical-align: -1px }

    /* ---- appearance picker ---- */
    .apx h4 { margin: 18px 0 8px; font-size: 13px; font-weight: 650; color: var(--t2); font-family: var(--fb); letter-spacing: 0 }
    .apx h4:first-child { margin-top: 4px }
    .sws { gap: 10px; margin: 2px 0 6px }
    .sws button { width: 44px; height: 44px }
    .sws button.cust { background: conic-gradient(#e11d48, #f59e0b, #16a34a, #0ea5e9, #9333ea, #e11d48) !important; position: relative; overflow: hidden }
    .sws button.cust input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; padding: 0; margin: 0; cursor: pointer }
    .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
    .pre { display: flex; flex-direction: column; gap: 8px; padding: 8px; border-radius: var(--rq); background: color-mix(in srgb, var(--tx) 5%, var(--sf)); text-align: left; font-size: 12.5px; font-weight: 650 }
    .pre i { display: block; height: 38px; border-radius: var(--rs); background: var(--pc); position: relative; overflow: hidden }
    .pre i::after { content: ""; position: absolute; left: 8px; right: 30%; bottom: 8px; height: 6px; border-radius: 4px; background: var(--pf, #fff); opacity: .85 }
    .pre.on { box-shadow: 0 0 0 2px var(--ac) }
    .tgl { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--bd) }
    .tgl:last-child { border: 0 }
    .tgl .rb { flex: 1 }

    /* ---- calendar ---- */
    .cal { background: var(--sf); border-radius: var(--rc); padding: 14px; box-shadow: var(--sh) }
    .calh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px }
    .calh b { font-family: var(--fd); font-size: 21px; letter-spacing: -.04em; font-weight: 700 }
    .calh .ib .i { transform: none }
    .calg { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center }
    .calg .wd { font-size: 12px; font-weight: 650; color: var(--t2); padding: 4px 0 6px }
    .cd { aspect-ratio: 1; border-radius: var(--rs); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 14px; font-weight: 600; position: relative; min-width: 0 }
    .cd.out { opacity: .3 }
    .cd.today { box-shadow: inset 0 0 0 2px var(--ac) }
    .cd.sel { background: var(--ac); color: #fff }
    .cd .dots { display: flex; gap: 2px; height: 5px }
    .cd .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--t2) }
    .cd .dots i.k-er { background: var(--er) }
    .cd .dots i.k-wn { background: var(--wn) }
    .cd .dots i.k-ok { background: var(--ok) }
    .cd.sel .dots i { background: #fff }
    .cleg { display: flex; gap: 14px; flex-wrap: wrap; margin: 12px 2px 0; font-size: 12.5px; color: var(--t2); font-weight: 600 }
    .cleg span { display: inline-flex; align-items: center; gap: 6px }
    .cleg i { width: 8px; height: 8px; border-radius: 50% }

    /* ---- insights ---- */
    .inx { display: grid; grid-template-columns: 1fr; gap: 12px }
    @media(min-width:700px) { .inx { grid-template-columns: 1fr 1fr } .inx .wide { grid-column: 1/-1 } }
    .inx .card h3 { font-size: 17px; margin-bottom: 14px }
    .dn { display: flex; align-items: center; gap: 18px }
    .dn svg { flex: none; width: 128px; height: 128px; transform: rotate(-90deg) }
    .dn .ctr { position: relative; width: 128px; height: 128px; flex: none; display: grid; place-items: center }
    .dn .ctr b { position: absolute; font-family: var(--fd); font-size: 32px; letter-spacing: -.05em }
    .lg2 { display: flex; flex-direction: column; gap: 9px; font-size: 14px; font-weight: 600; flex: 1; min-width: 0 }
    .lg2 span { display: flex; align-items: center; gap: 8px }
    .lg2 i { width: 10px; height: 10px; border-radius: 3px; flex: none }
    .lg2 em { margin-left: auto; font-style: normal; color: var(--t2) }
    .bars { display: flex; align-items: flex-end; gap: 6px; height: 120px }
    .bars div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 5px; height: 100%; font-size: 11px; font-weight: 650; color: var(--t2); min-width: 0 }
    .bars i { display: block; width: 100%; border-radius: 6px 6px 3px 3px; background: color-mix(in srgb, var(--ac) 55%, var(--sf)); min-height: 4px }
    .bars div.cur i { background: var(--ac) }
    .bars div.od i { background: var(--er) }
    .bars em { font-style: normal; color: var(--tx); font-size: 12px }
    .hb { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 14px; font-weight: 600 }
    .hb span { width: 38%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    .hb u { flex: 1; height: 10px; border-radius: 6px; background: color-mix(in srgb, var(--tx) 8%, transparent); text-decoration: none; overflow: hidden }
    .hb u i { display: block; height: 100%; border-radius: 6px; background: var(--ac) }
    .hb em { font-style: normal; color: var(--t2); width: 22px; text-align: right }
    .ring { width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--c) calc(var(--p) * 1%), color-mix(in srgb, var(--tx) 10%, transparent) 0); flex: none }
    .ring i { width: 78px; height: 78px; border-radius: 50%; background: var(--sf); display: grid; place-items: center; font-style: normal; font-family: var(--fd); font-size: 28px; font-weight: 750; letter-spacing: -.05em }
    .hl { display: flex; align-items: center; gap: 18px; margin-bottom: 8px }
    .hl p { color: var(--t2); font-size: 14px; line-height: 1.5 }
    .hs { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 0; border-bottom: 1px solid var(--bd) }
    .hs .vav { width: 40px; height: 40px; font-size: 16px; border-radius: var(--rs) }
    .hs div { flex: 1; min-width: 0 }
    .hs b, .hs small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    .hsec { font-size: 13px; font-weight: 650; margin: 16px 0 2px; display: flex; align-items: center; gap: 8px }
    .hsec em { font-style: normal; background: color-mix(in srgb, var(--er) 14%, transparent); color: var(--er); border-radius: var(--rb); padding: 1px 9px; font-size: 12px }
    .gen { display: flex; align-items: center; gap: 8px; margin-bottom: 8px }
    .gen output { flex: 1; min-width: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 17px; letter-spacing: .3px; word-break: break-all; padding: 14px 16px; border-radius: var(--ri); background: color-mix(in srgb, var(--tx) 5%, var(--sf)); line-height: 1.35 }
    .gl { display: flex; justify-content: space-between; align-items: baseline }
    .gl b { font-family: var(--fd); font-size: 18px }

    @media(prefers-reduced-motion:reduce) { *, *:before, *:after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important } }

    /* =====================================================================
       v7 "WALLET" REDESIGN: paper palettes, serif display type, floating dock,
       ID-card documents, ledger summary, icon quick actions.
       ===================================================================== */
    :root {
      --bg: #f3efe7; --sf: #fffdf9; --tx: #1b1812; --t2: #7a7365; --bd: #e7e0d2; --hd: #0d0c0a; --dk: #15130f;
      --ok: #1f9d63; --wn: #d98a0b; --er: #d8283f;
      --fd: "Fraunces", "Iowan Old Style", Georgia, "Times New Roman", serif;
      --fb: Figtree, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --sh: 0 1px 2px #2a22140a; --sh2: 0 28px 60px -22px #2a221466, 0 4px 14px #2a22141a;
      --rc: 22px; --rt: 26px; --rb: 999px; --ri: 14px; --rm: 28px; --rs: 12px; --rq: 18px
    }
    [data-t=dark] { --bg: #0f0e0c; --sf: #1a1814; --tx: #f4efe6; --t2: #a39b8b; --bd: #2a2721; --hd: #0a0908; --dk: #26231d; --sh: 0 1px 0 #ffffff07 inset; --sh2: 0 28px 60px -20px #000e, 0 4px 14px #0009 }
    /* surface palettes: light then dark */
    [data-pal=snow] { --bg: #f4f5f8; --sf: #ffffff; --tx: #101828; --t2: #667085; --bd: #e4e7ec; --hd: #0b1020; --dk: #111827 }
    [data-pal=mist] { --bg: #e8eff6; --sf: #f8fbfe; --tx: #0f1b2a; --t2: #5d6f84; --bd: #d4dfea; --hd: #0a1522; --dk: #11202f }
    [data-pal=sage] { --bg: #eaefe3; --sf: #f9fbf6; --tx: #151b11; --t2: #66705c; --bd: #d8e0cd; --hd: #0b140c; --dk: #142016 }
    [data-pal=blush] { --bg: #f8ebe7; --sf: #fffaf8; --tx: #231416; --t2: #85696a; --bd: #ecd8d1; --hd: #1a0c0e; --dk: #2a1517 }
    [data-pal=lilac] { --bg: #efeaf7; --sf: #fcfaff; --tx: #1a1426; --t2: #71688a; --bd: #ddd5ee; --hd: #120d1d; --dk: #1d1630 }
    [data-pal=butter] { --bg: #f6eed2; --sf: #fffcf0; --tx: #201b08; --t2: #7a6e43; --bd: #e8dcae; --hd: #17130a; --dk: #231e0d }
    [data-t=dark][data-pal=snow] { --bg: #0b0c0f; --sf: #15171c; --tx: #f2f4f8; --t2: #8d94a3; --bd: #23262e; --hd: #07080b; --dk: #20232b }
    [data-t=dark][data-pal=mist] { --bg: #0a1017; --sf: #121b25; --tx: #eaf1f8; --t2: #8196ad; --bd: #1f2d3b; --hd: #060b10; --dk: #1b2a39 }
    [data-t=dark][data-pal=sage] { --bg: #0a100b; --sf: #131b14; --tx: #ecf3e8; --t2: #8a9b86; --bd: #212c22; --hd: #060a07; --dk: #1d2a1f }
    [data-t=dark][data-pal=blush] { --bg: #140c0d; --sf: #1f1415; --tx: #f8ecea; --t2: #b18f8f; --bd: #33201f; --hd: #0d0707; --dk: #301d1e }
    [data-t=dark][data-pal=lilac] { --bg: #0e0b14; --sf: #17131f; --tx: #f1ecfa; --t2: #9a90b4; --bd: #272035; --hd: #09070e; --dk: #231c33 }
    [data-t=dark][data-pal=butter] { --bg: #12100a; --sf: #1c1a10; --tx: #f6f1dc; --t2: #a79d74; --bd: #2e2a18; --hd: #0b0a06; --dk: #2a2614 }
    [data-t=dark][data-b="1"][data-pal] { --bg: #000; --sf: #0c0c0c; --bd: #1c1c1c; --hd: #000; --dk: #151515 }
    [data-r=soft] { --rc: 16px; --rt: 20px; --ri: 11px; --rm: 22px; --rs: 10px; --rq: 14px }
    [data-r=sharp] { --rc: 6px; --rt: 8px; --rb: 6px; --ri: 6px; --rm: 10px; --rs: 5px; --rq: 7px }
    [data-f=clean] { --fd: Figtree, system-ui, sans-serif }
    [data-f=system] { --fd: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --fb: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif }
    [data-f=classic] { --fd: Georgia, "Iowan Old Style", "Times New Roman", serif; --fb: Georgia, "Iowan Old Style", serif }
    [data-f=mono] { --fd: ui-monospace, "SF Mono", Menlo, Consolas, monospace; --fb: ui-monospace, "SF Mono", Menlo, Consolas, monospace }
    body { background: var(--bg); color: var(--tx); font-size: 15.5px }
    body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: var(--sat); background: var(--hd); z-index: 300; pointer-events: none }
    h1, h2, h3, .ph h2, .h, .in b { font-weight: 600; letter-spacing: -.02em }
    [data-f=mono] h1, [data-f=mono] h2, [data-f=mono] h3 { letter-spacing: -.04em }

    /* ---- top bar: light and quiet, status strip stays dark ---- */
    .tb { background: var(--bg); color: var(--tx); border-radius: 0; box-shadow: none; padding: calc(10px + var(--sat)) 18px 10px }
    .tb .lgi { width: 30px; height: 30px; border-radius: 9px }
    .tb b { font-family: var(--fd); font-size: 22px; font-weight: 600; letter-spacing: -.03em }
    .tb b em { font-style: italic; font-weight: 500; color: var(--ac); margin-left: 3px }
    .tb .ib { background: color-mix(in srgb, var(--tx) 8%, transparent); color: var(--tx) }
    .tb .off { background: var(--er); color: #fff; border-radius: var(--rb); font-size: 11px; padding: 3px 9px }
    #ts { top: calc(var(--sat) + 66px) }

    /* ---- floating dock: dark pill, active item expands with its label ---- */
    .tabs { display: flex; justify-content: space-between; align-items: center; gap: 2px; left: 10px; right: 10px; bottom: calc(12px + var(--sab)); max-width: 480px; margin: 0 auto; padding: 5px 6px; border: 1px solid #ffffff12; border-radius: var(--rb); background: var(--dk); box-shadow: 0 22px 44px -14px #000a, 0 2px 8px #0005 }
    .tabs button { flex-direction: row; flex: none; justify-content: center; align-items: center; gap: 7px; height: 44px; min-width: 40px; padding: 0 9px; border-radius: var(--rb); color: #ffffff94; transition: background .2s, color .2s }
    .tabs button span { display: none; font-size: 13px; font-weight: 650; letter-spacing: 0; color: inherit }
    .tabs button::before { display: none }
    .tabs button.on { background: var(--ac); color: #fff; padding: 0 14px }
    .tabs button.on span { display: block }
    .tabs .plus { position: static; width: 48px; height: 48px; min-width: 48px; padding: 0; margin: -10px 0; border-radius: 50%; background: #f6f1e6; color: #15130f; border: 4px solid var(--bg); box-shadow: 0 10px 20px -8px #0008 }
    .tabs .plus.on { background: #f6f1e6; color: #15130f }
    @media(max-width:389px) { .tabs button.on span { display: none } .tabs button.on { padding: 0 13px } }
    @media(min-width:900px) { #ts { top: 22px } }

    /* ---- desktop side bar ---- */
    .side { background: var(--sf); box-shadow: 1px 0 0 var(--bd) }
    .side b { font-family: var(--fd); font-size: 18px; line-height: 1.1; font-weight: 600 }
    .side nav button.on { background: var(--tx); color: var(--bg) }
    .side .me { background: color-mix(in srgb, var(--tx) 5%, transparent) }

    /* ---- titles ---- */
    .ph h2 { font-size: 40px; line-height: 1.02; font-weight: 600; letter-spacing: -.035em }
    .h { font-size: 22px; font-weight: 600; margin: 30px 0 12px; letter-spacing: -.025em }
    .sh { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 30px 0 12px }
    .sh .h { margin: 0 }
    .lnk { font-size: 13.5px; font-weight: 650; color: var(--ac); padding: 4px 2px }

    /* ---- home ---- */
    .gh { display: block; margin: 8px 0 18px }
    .gh small { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--t2) }
    .gh h2 { font-size: 40px; line-height: 1.04; letter-spacing: -.04em; font-weight: 600; margin-top: 8px }
    .gh h2 i { font-style: italic; color: var(--ac); font-weight: 500 }
    .ledger { display: grid; grid-template-columns: auto 1fr; gap: 6px 22px; align-items: center; padding: 20px; border-radius: var(--rt); background: var(--sf); border: 1px solid var(--bd); box-shadow: var(--sh) }
    .lring { width: 116px; height: 116px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--ok) calc(var(--p) * 1%), color-mix(in srgb, var(--tx) 9%, transparent) 0) }
    .lring i { width: 88px; height: 88px; border-radius: 50%; background: var(--sf); display: flex; flex-direction: column; align-items: center; justify-content: center; font-style: normal }
    .lring b { font-family: var(--fd); font-size: 30px; line-height: 1; font-weight: 600; letter-spacing: -.04em }
    .lring small { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--t2); margin-top: 3px }
    .lrows { display: flex; flex-direction: column; min-width: 0 }
    .lr { display: flex; align-items: center; gap: 10px; padding: 9px 0; width: 100%; text-align: left; border-bottom: 1px dashed var(--bd) }
    .lr:last-child { border: 0 }
    .lr i { width: 9px; height: 9px; border-radius: 50%; flex: none }
    .lr span { flex: 1; font-weight: 600; font-size: 14.5px; min-width: 0 }
    .lr b { font-family: var(--fd); font-size: 21px; font-weight: 600 }
    .lfoot { grid-column: 1/-1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--bd) }
    .lfoot button { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--ri); background: color-mix(in srgb, var(--tx) 5%, transparent); text-align: left; font-size: 13px; color: var(--t2); font-weight: 600 }
    .lfoot button b { display: block; font-family: var(--fd); font-size: 19px; color: var(--tx); font-weight: 600; line-height: 1.1 }
    .lfoot .i { color: var(--ac); flex: none }
    .qa { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 6px; overflow: visible; margin: 22px 0 0; padding: 0 }
    .qa button { flex-direction: column; justify-content: flex-start; align-items: center; gap: 8px; padding: 0; background: none; box-shadow: none; border-radius: 0; color: var(--tx) }
    .qa button .i { width: 56px; height: 56px; padding: 16px; border-radius: 20px; background: var(--sf); border: 1px solid var(--bd); color: var(--ac); transition: transform .12s, background .2s }
    .qa button:active .i { transform: scale(.93); background: color-mix(in srgb, var(--ac) 12%, var(--sf)) }
    .qa span { font-size: 12px; font-weight: 650; color: var(--t2); text-align: center; line-height: 1.2 }
    @media(min-width:900px) { .qa { grid-template-columns: repeat(8, 1fr); margin: 22px 0 0; flex-wrap: unset } }
    .hero.vh + .qa { grid-template-columns: repeat(3, 1fr); margin: 14px 0 0; padding: 0 }
    .hero.vh + .qa button { padding: 0; border-radius: 0; flex-direction: column }
    .hero.vh + .qa .i { width: 56px; height: 56px }
    .hero.vh + .qa span { font-size: 12px }

    /* ---- wallet: documents as ID cards ---- */
    .wallet { display: flex; gap: 12px; overflow-x: auto; margin: 0 -16px; padding: 4px 16px 16px; scroll-snap-type: x mandatory; scrollbar-width: none }
    .wallet::-webkit-scrollbar { display: none }
    .wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
    @media(min-width:700px) { .wgrid { grid-template-columns: repeat(3, 1fr) } }
    .idc { --g1: color-mix(in srgb, var(--ac) 90%, #000); --g2: color-mix(in srgb, var(--ac) 48%, #08080c); position: relative; overflow: hidden; display: flex; flex-direction: column; text-align: left; flex: none; scroll-snap-align: start; width: min(300px, 80vw); aspect-ratio: 1.586; padding: 18px; border-radius: 24px; color: #fff; cursor: pointer; background: linear-gradient(135deg, var(--g1), var(--g2)); box-shadow: 0 24px 38px -22px var(--g2), inset 0 1px 0 #ffffff30; transition: transform .15s }
    .idc:active { transform: scale(.98) }
    .idc.k-er { --g1: #de2c44; --g2: #6e0c22 }
    .idc.k-wn { --g1: #e9990f; --g2: #8f3e05 }
    .idc.k-n { --g1: #596271; --g2: #1c2230 }
    .idc::before { content: ""; position: absolute; inset: 0; background: repeating-radial-gradient(circle at 115% -10%, #ffffff0d 0 2px, transparent 2px 14px); pointer-events: none }
    .idc::after { content: ""; position: absolute; right: -40px; bottom: -70px; width: 190px; height: 190px; border-radius: 50%; background: radial-gradient(circle, #ffffff22, transparent 68%); pointer-events: none }
    .idc > * { position: relative; z-index: 1 }
    .idc .t { display: flex; align-items: center; justify-content: space-between }
    .idc .ty { font-size: 10.5px; letter-spacing: .16em; font-weight: 750; opacity: .8 }
    .idc .ic2 { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; background: #ffffff24 }
    .idc b { font-family: var(--fd); font-size: 23px; line-height: 1.1; font-weight: 600; letter-spacing: -.02em; margin-top: auto; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
    .idc .no { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; letter-spacing: .08em; opacity: .85; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
    .idc .ft { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; font-size: 12px; font-weight: 600 }
    .idc .ft span { opacity: .85; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    .idc .ft em { font-style: normal; flex: none; padding: 4px 10px; border-radius: var(--rb); background: #ffffff26; font-weight: 700; font-size: 11.5px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px) }
    .wgrid .idc { width: auto; aspect-ratio: 1.12; padding: 14px }
    .wgrid .idc b { font-size: 18px }
    .wgrid .idc .no { font-size: 12px }
    .wgrid .idc .ft { flex-direction: column; align-items: flex-start; gap: 6px }

    /* ---- document rows ---- */
    .dc, .vc { position: relative; overflow: hidden; background: var(--sf); border: 1px solid var(--bd); box-shadow: none; border-radius: var(--rc); padding: 12px 12px 12px 14px; gap: 13px; margin-bottom: 10px }
    .dc:hover, .vc:hover { transform: none; box-shadow: var(--sh2) }
    .dc::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 4px; border-radius: 0 4px 4px 0; background: var(--sc, transparent) }
    .dc[data-s=er] { --sc: var(--er); background: color-mix(in srgb, var(--er) 5%, var(--sf)) }
    .dc[data-s=wn] { --sc: var(--wn); background: color-mix(in srgb, var(--wn) 6%, var(--sf)) }
    .dc[data-s=ok] { --sc: color-mix(in srgb, var(--ok) 55%, transparent) }
    [data-card=plain] .dc[data-s] { background: var(--sf) }
    .ic, .vp { width: 50px; height: 50px; border-radius: var(--rq); flex: none }
    .vp { width: 60px; height: 60px }
    .in b { font-family: var(--fd); font-size: 18px; font-weight: 600; line-height: 1.2 }
    .in small { font-size: 13px; margin: 3px 0 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block }
    .in .pgx { font-size: 12px; color: var(--t2); font-weight: 600; margin-left: 8px }
    .rt { display: flex; flex-direction: row; align-items: center; gap: 6px; font-size: 12px }
    .dc .rt, .dc .star, .dc .ib { flex: none }
    .bd { padding: 3px 10px }
    [data-d=compact] .dc, [data-d=compact] .vc { padding: 8px 10px 8px 12px; margin-bottom: 7px }
    [data-d=compact] .in small { margin: 1px 0 4px }
    [data-d=compact] .idc { padding: 14px }
    [data-d=compact] .ledger { padding: 15px }
    .chip { background: var(--sf); border: 1px solid var(--bd); box-shadow: none }
    .chip.on { background: var(--tx); color: var(--bg); border-color: var(--tx) }
    .srch input { background: var(--sf); border: 1px solid var(--bd) }
    .srch input:focus { border-color: var(--ac) }
    .card { border: 1px solid var(--bd); box-shadow: none }
    .st { border: 1px solid var(--bd); box-shadow: none }
    .st b { font-weight: 600 }
    .btn { box-shadow: none }
    .vlock .big { border-radius: var(--rt) }
    .ftile { border: 1px solid var(--bd); box-shadow: none }
    .ftile b { font-weight: 600 }
    .empty { background: transparent }
    .md { border: 1px solid var(--bd) }
    .mh h3 { font-weight: 600 }

    /* ---- appearance: surfaces, themes, switches ---- */

    .seg.c2 { grid-template-columns: repeat(2, 1fr) }

    [data-dock=light] .tabs button { color: var(--t2) }
    [data-dock=light] .tabs button.on { color: #fff }
    [data-dock=light] .tabs .plus { background: var(--tx); color: var(--bg); border-color: var(--bg) }

    .nag { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; margin-bottom: 12px; border-radius: var(--rc); background: color-mix(in srgb, var(--wn) 12%, var(--sf)); border: 1px solid color-mix(in srgb, var(--wn) 35%, transparent); color: var(--wn) }

  /* ===== Paste this at the VERY END of your <style> block (after the v7 block) ===== */

/* 1) Stop words breaking in the middle ("Documen / ts").
      break-word only wraps when a single word cannot fit at all, "anywhere" broke every word. */
.gh h2, .ph h2, .pfi h2, .in b, .idc b, .tt b, .emc b, .hero h2, .side b {
  overflow-wrap: break-word;
  word-break: normal;
  hyphens: none;
}

.ph { flex-wrap: nowrap; }
