    /* Manual crop: drag to move, pinch / mouse wheel / slider to zoom. Returns base64 JPEG (480x480) or null */
    function cropPhoto(file) {
      return new Promise(async res => {
        const url = URL.createObjectURL(file), img = new Image();
        try { await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = url }) }
        catch (e) { URL.revokeObjectURL(url); toast('Could not read this image', 'er'); return res(null) }
        const nw = img.naturalWidth, nh = img.naturalHeight;
        let BOX = 280, base = 1, z = 1, x = 0, y = 0, box, im, zr;
        const clamp = () => {
          const w = nw * base * z, h = nh * base * z, mx = Math.max(0, (w - BOX) / 2), my = Math.max(0, (h - BOX) / 2);
          x = Math.max(-mx, Math.min(mx, x)); y = Math.max(-my, Math.min(my, y))
        };
        const paint = () => {
          clamp(); const w = nw * base * z, h = nh * base * z;
          im.style.width = w + 'px'; im.style.height = h + 'px';
          im.style.left = (BOX / 2 + x - w / 2) + 'px'; im.style.top = (BOX / 2 + y - h / 2) + 'px';
          zr.value = z
        };
        const o = await modal({
          title: 'Crop photo', icon: 'camera', sticky: 1, ok: 'Use photo', noFocus: 1,
          html: `<div class="crop" id="cp_b"><img id="cp_i" src="${url}" alt="" draggable="false"><span class="crm"></span></div>
            <div class="crz">${I('image', 16)}<input id="cp_z" type="range" min="1" max="4" step="0.01" value="1" aria-label="Zoom">${I('image', 24)}</div>
            <p class="t2" style="font-size:12.5px;text-align:center;margin-top:8px">Drag to move. Pinch or use the slider to zoom.</p>`,
          onOpen: el => {
            box = el.querySelector('#cp_b'); im = el.querySelector('#cp_i'); zr = el.querySelector('#cp_z');
            BOX = box.clientWidth || 280; base = BOX / Math.min(nw, nh); paint();
            const P = new Map(); let d0 = 0, z0 = 1;
            const pd = () => { const a = [...P.values()]; return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) };
            box.addEventListener('pointerdown', e => { box.setPointerCapture(e.pointerId); P.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (P.size == 2) { d0 = pd(); z0 = z } });
            box.addEventListener('pointermove', e => {
              const p = P.get(e.pointerId); if (!p) return;
              if (P.size == 1) { x += e.clientX - p.x; y += e.clientY - p.y }
              p.x = e.clientX; p.y = e.clientY;
              if (P.size == 2 && d0) z = Math.max(1, Math.min(4, z0 * pd() / d0));
              paint()
            });
            const up = e => { P.delete(e.pointerId); d0 = 0 };
            box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
            box.addEventListener('wheel', e => { e.preventDefault(); z = Math.max(1, Math.min(4, z - e.deltaY / 400)); paint() }, { passive: false });
            zr.addEventListener('input', () => { z = +zr.value; paint() })
          },
          pre: () => {
            const s = base * z, w = nw * s, h = nh * s, c = document.createElement('canvas'); c.width = c.height = 480;
            const sx = (w / 2 - BOX / 2 - x) / s, sy = (h / 2 - BOX / 2 - y) / s, sw = BOX / s;
            const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, 480, 480);
            g.drawImage(img, sx, sy, sw, sw, 0, 0, 480, 480);
            return c.toDataURL('image/jpeg', .9).split(',')[1]
          }
        });
        URL.revokeObjectURL(url); res(o || null)
      })
    }

const FIT = '.ph h2, .gh h2, .hero h2';
function fitText() {
  document.querySelectorAll(FIT).forEach(el => {
    el.style.fontSize = '';
    if (!el.clientWidth) return;
    let s = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth + 1 && s > 18) { s -= 1; el.style.fontSize = s + 'px' }
  })
}
(() => {
  let t; const run = () => { cancelAnimationFrame(t); t = requestAnimationFrame(fitText) };
  new MutationObserver(run).observe($('#main'), { childList: true });
  addEventListener('resize', run);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(run);
})();




    /* ---------- app update manager ----------
   Every deploy stamps the commit id into APP_VER and writes version.json:
   { "v": "<commit>", "msg": "Short summary", "notes": ["Item 1","Item 2"], "force": false }
   "Later" is remembered per version. "force": true removes the Later button. */
const APP_VER = '__APP_VERSION__';
const VER_OK = /^[0-9a-f]{6,}$/i.test(APP_VER);
function verTxt() { return VER_OK ? APP_VER.slice(0, 7) : 'dev' }
function checkUpdate(m) { return Updater.check(m === 1 || m === true) }

const Updater = (() => {
  const CFG = { file: 'version.json', every: 15 * 60 * 1000, gap: 10 * 60 * 1000, timeout: 8000, retries: 2, kSkip: 'nxskip', kDone: 'nxupd' };
  const U = { busy: 0, last: 0, ask: 0 };
  const short = v => String(v || '').slice(0, 7);
  const ls = {
    get(k) { try { return localStorage.getItem(k) || '' } catch (e) { return '' } },
    set(k, v) { try { localStorage.setItem(k, v) } catch (e) { } },
    del(k) { try { localStorage.removeItem(k) } catch (e) { } }
  };

  /* fetch version.json with timeout + retry (0.5s, 1s backoff) */
  async function getInfo() {
    let err;
    for (let i = 0; i <= CFG.retries; i++) {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), CFG.timeout);
      try {
        const r = await fetch(CFG.file + '?_=' + Date.now(), { cache: 'no-store', signal: ctl.signal });
        if (!r.ok) throw Error('HTTP ' + r.status);
        return await r.json()
      } catch (e) { err = e; if (i < CFG.retries) await new Promise(res => setTimeout(res, 500 * 2 ** i)) }
      finally { clearTimeout(t) }
    }
    throw err
  }

  /* do not interrupt: logged out, offline, PIN lock, any popup, viewer, loader */
  const quiet = () => S.user && navigator.onLine && !$('#lk.on') && !MS.length && !$('#vw.on') && !$('.ld.on');

  async function apply(v) {
    loader('Updating…');
    try {
      const r = await fetch(location.pathname, { cache: 'reload' }); if (!r.ok) throw Error('HTTP ' + r.status);
      try { const rg = await navigator.serviceWorker.getRegistrations(); await Promise.all(rg.map(async x => { x.waiting && x.waiting.postMessage({ type: 'SKIP_WAITING' }); await x.unregister() })) } catch (e) { }
      try { const c = await caches.keys(); await Promise.all(c.map(k => caches.delete(k))) } catch (e) { }
      ls.set(CFG.kDone, short(v)); ls.del(CFG.kSkip);
      location.reload()
    } catch (e) {
      unload(); ls.del(CFG.kSkip);
      alertBox('Could not download the update. Check your internet and try again.', 'Update failed')
    }
  }

  async function prompt(j, v) {
    if (U.ask) return; U.ask = 1;
    const force = j.force === true, notes = (Array.isArray(j.notes) ? j.notes : []).slice(0, 6);
    try {
      const ok = await modal({
        title: force ? 'Required update' : 'New update available', icon: 'download', sticky: 1, noFocus: 1,
        ok: 'Update now', cancel: force ? null : 'Later',
        html: `<p class="mt">A newer version of Nexus Docs is ready.</p>
          <div class="up-v"><s>${esc(verTxt())}</s>${I('right', 14)}<b>${esc(short(v))}</b></div>
          ${j.msg || notes.length ? `<div class="up-n"><small>What’s new</small>${j.msg ? `<strong>${esc(j.msg)}</strong>` : ''}${notes.length ? `<ul>${notes.map(n => `<li>${I('check', 15)}<span>${esc(n)}</span></li>`).join('')}</ul>` : ''}</div>` : ''}`,
        onOpen: el => { if (force) { const x = el.querySelector('.mx'); x && x.remove() } }
      });
      if (ok) return await apply(v);
      if (!force) ls.set(CFG.kSkip, v) /* Later: ask again only for the next version */
    } finally { U.ask = 0 }
  }

  async function check(manual) {
    if (U.busy) return;
    if (!VER_OK) { if (manual) toast('Development build. Updates are checked on the live app only', 'inf'); return }
    if (manual && !navigator.onLine) return toast('You are offline', 'er');
    if (!manual && (!quiet() || Date.now() - U.last < CFG.gap)) return;
    U.busy = 1;
    try {
      const j = await getInfo(), v = String((j && j.v) || ''); if (!v) throw Error('Bad version file');
      U.last = Date.now();
      if (v === APP_VER) { if (manual) toast('You are on the latest version'); return }
      if (!manual && j.force !== true && ls.get(CFG.kSkip) === v) return;
      await prompt(j, v)
    } catch (e) { if (manual) toast('Could not check for updates', 'er') }
    finally { U.busy = 0 }
  }

  function start() {
    const done = ls.get(CFG.kDone);
    if (done) { ls.del(CFG.kDone); if (done === short(APP_VER)) setTimeout(() => toast('Updated to version ' + done), 1200) }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(check, 1500) });
    addEventListener('online', () => setTimeout(check, 2000));
    setInterval(check, CFG.every)
  }
  return { start, check }
})();
Updater.start();

    /* ---------- INIT ---------- */
    applyPrefs();
    setTimeout(hideSplash, 7000);
    $('#sp img').src = LOGO; applyAc(); applyPrefs();
    let Q = new URLSearchParams(location.search).get('a') || '';
    if (Q == 'expiring' || Q == 'veh') { S.tab = Q == 'veh' ? 'veh' : 'docs'; Q = '' }
    if (!Q && ['docs', 'vault'].includes(UP.start)) S.tab = UP.start;
    try { history.replaceState(null, '', location.pathname) } catch (e) { }
    S.token ? load('sk') : authView('login');
    if (S.token && localStorage.nxpin) lockNow();
  </script>
