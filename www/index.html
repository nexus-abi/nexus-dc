  <style>
    :root {
      --bg: #f4f6fb;
      --sf: #fff;
      --tx: #0f1b3d;
      --t2: #6a7592;
      --ac: #3b5bfd;
      --bd: #e6eaf4;
      --ok: #12a150;
      --wn: #e08a00;
      --er: #e5484d;
      --sh: 0 1px 2px #1b2a6b0d, 0 8px 24px #1b2a6b10;
      --g: linear-gradient(135deg, #0f1b3d, #2d4bf0 75%, #7c3aed);
      --hd: #0f1b3d;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px)
    }

    [data-t=dark] {
      --bg: #080d1a;
      --sf: #111a2e;
      --tx: #eef2ff;
      --t2: #8d9bbd;
      --bd: #1f2b47;
      --sh: 0 8px 24px #0006;
      --hd: #0a1124
    }

    * {
      box-sizing: border-box
    }

    html {
      -webkit-text-size-adjust: 100%;
      overscroll-behavior-y: contain
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--tx);
      -webkit-tap-highlight-color: transparent;
      line-height: 1.4
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer;
      border: 0;
      background: none;
      padding: 0
    }

    a {
      color: var(--ac);
      cursor: pointer;
      font-weight: 600
    }

    small,
    .t2 {
      color: var(--t2)
    }

    h1,
    h2,
    h3,
    p {
      margin: 0
    }

    .i {
      flex: none;
      display: block
    }

    /* splash */
    #sp {
      position: fixed;
      inset: 0;
      background: var(--g);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      z-index: 300;
      transition: opacity .45s;
      color: #fff
    }

    #sp .lg {
      width: 72px;
      height: 72px;
      font-size: 34px;
      border-radius: 22px;
      animation: pl 1.4s infinite
    }

    #sp b {
      font-size: 20px;
      letter-spacing: .3px
    }

    #sp .bar {
      width: 140px;
      height: 4px;
      border-radius: 4px;
      background: #ffffff33;
      overflow: hidden
    }

    #sp .bar:after {
      content: "";
      display: block;
      height: 100%;
      width: 40%;
      background: #fff;
      border-radius: 4px;
      animation: ld 1.1s infinite ease-in-out
    }

    @keyframes pl {
      50% {
        transform: scale(1.07)
      }
    }

    @keyframes ld {
      0% {
        margin-left: -40%
      }

      100% {
        margin-left: 100%
      }
    }

    .lg {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #ffffff26;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 21px;
      color: #fff;
      flex: none
    }

    .lg.sm {
      width: 34px;
      height: 34px;
      font-size: 16px;
      border-radius: 11px;
      background: var(--g)
    }

    /* base ui */
    .card {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--sh)
    }

    .fld {
      position: relative;
      margin-bottom: 12px
    }

    .fld>.i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--t2);
      pointer-events: none
    }

    .fld input {
      padding-left: 44px
    }

    .fld .eye {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: var(--t2)
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 12px;
      border: 1.5px solid var(--bd);
      border-radius: 12px;
      background: var(--bg);
      outline: 0;
      transition: border-color .15s, box-shadow .15s
    }

    .fld input {
      margin: 0
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--ac);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--ac) 12%, transparent)
    }

    .lb {
      font-size: 12px;
      font-weight: 600;
      color: var(--t2);
      display: block;
      margin: 0 0 5px
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 20px;
      border-radius: 12px;
      background: var(--g);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 6px 16px color-mix(in srgb, var(--ac) 27%, transparent);
      transition: transform .1s, opacity .15s
    }

    .btn:active {
      transform: scale(.97)
    }

    .btn.full {
      width: 100%
    }

    .btn+.btn.full {
      margin-top: 10px
    }

    .btn.sec {
      background: var(--bg);
      color: var(--tx);
      box-shadow: none;
      border: 1.5px solid var(--bd)
    }

    .btn.dg {
      background: var(--er);
      box-shadow: 0 6px 16px #e5484d44
    }

    .btn.sm {
      padding: 9px 14px;
      font-size: 14px;
      border-radius: 10px
    }

    /* auth */
    .split {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh
    }

    .brand {
      background: var(--g);
      color: #fff;
      padding: calc(28px + var(--sat)) 24px 28px
    }

    .brand h1 {
      margin: 14px 0 6px;
      font-size: 26px
    }

    .brand p {
      opacity: .85
    }

    .brand ul {
      list-style: none;
      padding: 0;
      margin: 26px 0 0;
      display: none;
      gap: 14px;
      flex-direction: column
    }

    .brand li {
      display: flex;
      gap: 12px;
      align-items: center
    }

    .brand li .i {
      background: #ffffff22;
      padding: 8px;
      border-radius: 10px;
      width: 36px;
      height: 36px
    }

    .fm {
      display: grid;
      place-items: center;
      padding: 20px
    }

    .auth {
      width: 100%;
      max-width: 400px
    }

    .auth h1 {
      font-size: 24px;
      margin-bottom: 4px
    }

    .auth>p {
      color: var(--t2);
      margin-bottom: 18px
    }

    .sub {
      text-align: center;
      margin-top: 16px;
      color: var(--t2);
      font-size: 14px;
      line-height: 2
    }

    @media(min-width:900px) {
      .split {
        grid-template-columns: 1.1fr 1fr
      }

      .brand {
        padding: 60px;
        display: flex;
        flex-direction: column;
        justify-content: center
      }

      .brand h1 {
        font-size: 40px
      }

      .brand ul {
        display: flex
      }
    }

    /* shell */
    #shell {
      display: none
    }

    #shell.on {
      display: block
    }

    .side {
      display: none
    }

    .col {
      min-width: 0
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px 16px calc(120px + var(--sab));
      animation: fi .25s
    }

    @keyframes fi {
      from {
        opacity: 0;
        transform: translateY(6px)
      }
    }

    .tb {
      position: sticky;
      top: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: calc(10px + var(--sat)) 16px 10px;
      background: var(--hd);
      color: #fff;
      box-shadow: 0 2px 12px #0003
    }

    .tb .ib {
      background: #ffffff1f;
      color: #fff
    }

    .tb b {
      flex: 1
    }

    .tabs {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: var(--sf);
      border-top: 1px solid var(--bd);
      padding: 8px 6px calc(8px + var(--sab));
      z-index: 20
    }

    .tabs button,
    .side nav button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      color: var(--t2);
      font-weight: 600;
      padding: 4px 12px
    }

    .tabs button.on,
    .side button.on {
      color: var(--ac)
    }

    .tabs .plus {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--g);
      color: #fff;
      margin-top: -26px;
      box-shadow: 0 8px 18px color-mix(in srgb, var(--ac) 40%, transparent);
      justify-content: center;
      padding: 0
    }

    @media(min-width:900px) {
      #shell.on {
        display: grid;
        grid-template-columns: 250px 1fr
      }

      .tabs,
      .tb {
        display: none
      }

      main {
        width: 100%;
        max-width: 880px;
        padding: 32px
      }

      .side {
        display: flex;
        flex-direction: column;
        gap: 6px;
        position: sticky;
        top: 0;
        height: 100vh;
        padding: 24px 14px;
        background: var(--sf);
        border-right: 1px solid var(--bd)
      }

      .side .lg {
        background: var(--g)
      }

      .side nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 18px
      }

      .side nav button {
        flex-direction: row;
        gap: 12px;
        font-size: 15px;
        padding: 12px 14px;
        border-radius: 12px;
        width: 100%
      }

      .side nav button:hover {
        background: var(--bg)
      }

      .side nav button.on {
        background: color-mix(in srgb, var(--ac) 9%, transparent)
      }

      .side .add {
        margin-top: 14px
      }

      .side .me {
        margin-top: auto;
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px;
        border-radius: 14px;
        border: 1px solid var(--bd);
        text-align: left;
        width: 100%
      }

      .side .me div {
        min-width: 0
      }

      .side .me b,
      .side .me small {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px
      }
    }

    /* avatar */
    .av {
      border-radius: 50%;
      background: var(--g);
      color: #fff;
      font-weight: 800;
      display: grid;
      place-items: center;
      object-fit: cover;
      flex: none;
      width: 42px;
      height: 42px;
      font-size: 17px
    }

    .av.sm {
      width: 34px;
      height: 34px;
      font-size: 14px
    }

    .av.lg {
      width: 64px;
      height: 64px;
      font-size: 26px;
      border: 2px solid #fff6
    }

    .av.xl {
      width: 104px;
      height: 104px;
      font-size: 42px;
      border: 4px solid var(--sf);
      box-shadow: var(--sh)
    }

    /* pages */
    .ph {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px
    }

    .ph h2 {
      font-size: 24px
    }

    .h {
      margin: 24px 0 10px;
      font-size: 13px;
      color: var(--t2);
      text-transform: uppercase;
      letter-spacing: .7px;
      font-weight: 700
    }

    .hero {
      background: var(--g);
      color: #fff;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 12px 28px color-mix(in srgb, var(--ac) 27%, transparent);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 16px;
      justify-content: space-between
    }

    .hero:after {
      content: "";
      position: absolute;
      right: -40px;
      top: -50px;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: #ffffff14;
      pointer-events: none
    }

    .hero small {
      color: #ffffffb3
    }

    .hero h2 {
      font-size: 26px;
      margin: 2px 0 6px
    }

    .hero p {
      opacity: .9;
      font-size: 14px
    }

    .hero button {
      position: relative;
      z-index: 1
    }

    .hero.vh {
      justify-content: flex-start
    }

    .hero.vh img {
      width: 84px;
      height: 84px;
      border-radius: 16px;
      object-fit: cover;
      border: 2px solid #fff6;
      cursor: pointer
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(78px, 1fr));
      gap: 10px;
      margin: 14px 0
    }

    .st {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 16px;
      padding: 14px 8px;
      text-align: center;
      box-shadow: var(--sh)
    }

    .st b {
      font-size: 24px;
      display: block
    }

    .st small {
      font-size: 12px
    }

    .st.wn b {
      color: var(--wn)
    }

    .st.er b {
      color: var(--er)
    }

    .qa {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 14px 0
    }

    .qa button {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 16px;
      padding: 16px 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      box-shadow: var(--sh);
      color: var(--ac);
      transition: transform .1s
    }

    .qa button:active {
      transform: scale(.96)
    }

    .qa span {
      font-size: 12px;
      font-weight: 600;
      color: var(--tx)
    }

    .dc,
    .vc {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      margin-bottom: 10px;
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 16px;
      cursor: pointer;
      box-shadow: var(--sh);
      transition: transform .12s, border-color .15s
    }

    .dc:hover,
    .vc:hover {
      border-color: var(--ac)
    }

    .dc:active,
    .vc:active {
      transform: scale(.99)
    }

    .ic,
    .vp {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: color-mix(in srgb, var(--ac) 9%, transparent);
      color: var(--ac);
      display: grid;
      place-items: center;
      flex: none
    }

    .ic.er {
      background: #e5484d1f;
      color: var(--er)
    }

    .ic.wn {
      background: #e08a001f;
      color: var(--wn)
    }

    .ic.ok {
      background: #12a1501f;
      color: var(--ok)
    }

    .vp {
      width: 60px;
      height: 60px;
      object-fit: cover
    }

    .in {
      flex: 1;
      min-width: 0
    }

    .in b {
      display: block
    }

    .in small {
      display: block;
      margin: 2px 0 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .rt {
      text-align: right;
      font-size: 12px;
      color: var(--t2);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px
    }

    .ib {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--bg);
      display: grid;
      place-items: center
    }

    .ch {
      color: var(--t2)
    }

    .bd {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
      display: inline-block;
      background: var(--bg);
      color: var(--t2)
    }

    .er {
      color: var(--er);
      background: #e5484d1f
    }

    .wn {
      color: var(--wn);
      background: #e08a001f
    }

    .ok {
      color: var(--ok);
      background: #12a1501f
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin: 0 0 12px;
      padding-bottom: 2px
    }

    .chip {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1.5px solid var(--bd);
      background: var(--sf);
      white-space: nowrap;
      font-weight: 600;
      font-size: 14px
    }

    .chip.on {
      background: var(--ac);
      color: #fff;
      border-color: var(--ac)
    }

    .srch {
      position: relative
    }

    .srch .i {
      position: absolute;
      left: 14px;
      top: 14px;
      color: var(--t2)
    }

    .srch input {
      padding-left: 44px
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .empty {
      text-align: center;
      color: var(--t2);
      padding: 34px 10px;
      border: 2px dashed var(--bd);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px
    }

    .bk {
      color: var(--ac);
      font-weight: 700;
      margin-bottom: 12px;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 4px
    }

    .sk {
      background: linear-gradient(90deg, var(--bd), var(--bg), var(--bd));
      background-size: 200% 100%;
      animation: sh 1.2s infinite;
      border-radius: 16px
    }

    @keyframes sh {
      to {
        background-position: -200% 0
      }
    }

    /* profile */
    .cover {
      height: 120px;
      border-radius: 22px 22px 0 0;
      background: var(--g);
      position: relative;
      overflow: hidden
    }

    .cover:after {
      content: "";
      position: absolute;
      right: -30px;
      top: -60px;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: #ffffff14
    }

    .pfc {
      padding: 0;
      overflow: hidden
    }

    .pfh {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 14px;
      padding: 0 20px 20px;
      margin-top: -52px
    }

    .avw {
      position: relative;
      border-radius: 50%
    }

    .cam {
      position: absolute;
      right: 2px;
      bottom: 4px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--ac);
      color: #fff;
      display: grid;
      place-items: center;
      border: 3px solid var(--sf)
    }

    .pfi {
      flex: 1;
      min-width: 160px;
      padding-top: 56px
    }

    .pfi h2 {
      font-size: 22px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap
    }

    .pfi small {
      display: block
    }

    .vb {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      color: var(--ok);
      background: #12a1501f;
      padding: 3px 9px;
      border-radius: 12px
    }

    .pg2 {
      height: 8px;
      border-radius: 8px;
      background: var(--bg);
      overflow: hidden;
      margin: 10px 0 8px
    }

    .pg2 i {
      display: block;
      height: 100%;
      background: var(--g);
      border-radius: 8px;
      transition: width .6s
    }

    .grp {
      padding: 6px 18px
    }

    .row {
      display: flex;
      gap: 14px;
      align-items: center;
      width: 100%;
      padding: 14px 0;
      border-bottom: 1px solid var(--bd);
      text-align: left
    }

    .grp>.row:last-child {
      border: 0
    }

    .ri {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--ac) 8%, transparent);
      color: var(--ac);
      display: grid;
      place-items: center;
      flex: none
    }

    .row.rd .ri {
      background: #e5484d1a;
      color: var(--er)
    }

    .row.rd b {
      color: var(--er)
    }

    .rb {
      flex: 1;
      min-width: 0
    }

    .rb b {
      display: block;
      font-size: 15px;
      font-weight: 600;
      overflow-wrap: anywhere
    }

    .rb small {
      display: block;
      font-size: 12.5px
    }

    .rb i {
      color: var(--t2);
      font-weight: 400;
      font-style: normal
    }

    .sw {
      position: relative;
      width: 48px;
      height: 28px;
      flex: none
    }

    .sw input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
      z-index: 1
    }

    .sw span {
      position: absolute;
      inset: 0;
      background: var(--bd);
      border-radius: 20px;
      transition: .2s
    }

    .sw span:after {
      content: "";
      position: absolute;
      left: 3px;
      top: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px #0004;
      transition: .2s
    }

    .sw input:checked+span {
      background: var(--ac)
    }

    .sw input:checked+span:after {
      transform: translateX(20px)
    }

    /* forms in modal */
    .seg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--bg);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 12px
    }

    .seg button {
      padding: 10px;
      border-radius: 9px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--t2)
    }

    .seg .on {
      background: var(--sf);
      color: var(--ac);
      box-shadow: var(--sh)
    }

    .drop {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
      padding: 18px;
      border: 2px dashed var(--ac);
      border-radius: 14px;
      color: var(--ac);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin: 2px 0 10px;
      background: color-mix(in srgb, var(--ac) 5%, transparent)
    }

    .drop.dg {
      background: color-mix(in srgb, var(--ac) 13%, transparent)
    }

    .fi {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      background: var(--bg);
      border-radius: 10px;
      margin-bottom: 6px;
      font-size: 14px
    }

    .fi span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: flex;
      gap: 8px;
      align-items: center
    }

    .fi button {
      color: var(--er)
    }

    .pv {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 12px
    }

    .pv img,
    .pv .vp {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      object-fit: cover
    }

    /* custom modal / sheet / toast / loader */
    .ov {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #050a1a99;
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      transition: opacity .2s
    }

    .ov.on {
      opacity: 1
    }

    .md {
      width: 100%;
      max-width: 440px;
      max-height: calc(100dvh - 32px);
      display: flex;
      flex-direction: column;
      background: var(--sf);
      border-radius: 22px;
      box-shadow: 0 24px 60px #0007;
      transform: translateY(18px) scale(.97);
      transition: transform .25s cubic-bezier(.2, .9, .3, 1.15)
    }

    .ov.on .md {
      transform: none
    }

    .md.wide {
      max-width: 560px
    }

    .mh {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 20px 6px
    }

    .mh h3 {
      flex: 1;
      font-size: 19px;
      overflow-wrap: anywhere
    }

    .mi {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--ac) 9%, transparent);
      color: var(--ac);
      display: grid;
      place-items: center;
      flex: none
    }

    .mi.er {
      background: #e5484d1f;
      color: var(--er)
    }

    .mi.wn {
      background: #e08a001f;
      color: var(--wn)
    }

    .mx {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: var(--t2)
    }

    .mx:hover {
      background: var(--bg)
    }

    .mb {
      padding: 10px 20px;
      overflow: auto;
      -webkit-overflow-scrolling: touch
    }

    .mb p.mt {
      color: var(--t2);
      line-height: 1.6
    }

    .me {
      display: none;
      margin: 2px 0 6px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #e5484d1a;
      color: var(--er);
      font-size: 13.5px;
      font-weight: 600
    }

    .me.on {
      display: block
    }

    .mf {
      display: flex;
      gap: 10px;
      padding: 12px 20px 20px
    }

    .mf .btn {
      flex: 1;
      margin: 0
    }

    .sl {
      display: flex;
      flex-direction: column;
      padding-bottom: 12px
    }

    .si {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 6px;
      border-radius: 12px;
      text-align: left;
      width: 100%
    }

    .si:hover {
      background: var(--bg)
    }

    .si .i {
      color: var(--ac)
    }

    .si span {
      flex: 1
    }

    .si b {
      display: block;
      font-weight: 600
    }

    .si small {
      display: block;
      font-size: 12.5px
    }

    .si.rd,
    .si.rd .i {
      color: var(--er)
    }

    @media(max-width:600px) {
      .ov {
        align-items: flex-end;
        padding: 0
      }

      .md,
      .md.wide {
        max-width: none;
        border-radius: 22px 22px 0 0;
        transform: translateY(100%);
        max-height: 92dvh
      }

      .mf {
        padding-bottom: calc(20px + var(--sab))
      }
    }

    #ts {
      position: fixed;
      z-index: 200;
      left: 50%;
      transform: translateX(-50%);
      top: calc(14px + var(--sat));
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: calc(100% - 28px);
      max-width: 420px;
      pointer-events: none
    }

    .to {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 14px;
      background: var(--tx);
      color: var(--bg);
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 10px 30px #0004;
      opacity: 0;
      transform: translateY(-14px);
      transition: .28s
    }

    .to.in {
      opacity: 1;
      transform: none
    }

    .to.ok .i {
      color: #4ade80
    }

    .to.er .i {
      color: #ff8b8f
    }

    .to.inf .i {
      color: #8aa4ff
    }

    .ld {
      position: fixed;
      inset: 0;
      z-index: 150;
      background: #050a1a80;
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s
    }

    .ld.on {
      opacity: 1;
      pointer-events: auto
    }

    .lc {
      background: var(--sf);
      border-radius: 20px;
      padding: 26px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 20px 50px #0006;
      min-width: 190px
    }

    .sp {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 4px solid var(--bd);
      border-top-color: var(--ac);
      animation: sn .8s linear infinite
    }

    @keyframes sn {
      to {
        transform: rotate(360deg)
      }
    }

    /* viewer */
    #vw {
      position: fixed;
      inset: 0;
      background: #05080f;
      z-index: 50;
      display: none;
      flex-direction: column;
      padding-bottom: var(--sab)
    }

    #vw.on {
      display: flex
    }

    #vw nav {
      height: calc(56px + var(--sat));
      display: flex;
      align-items: center;
      gap: 10px;
      padding: var(--sat) 12px 0;
      color: #fff;
      flex: none
    }

    #vw nav b {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis
    }

    #vw nav button,
    #vw nav a {
      background: #ffffff1f;
      color: #fff;
      border: 0;
      padding: 8px 14px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px
    }

    #zc {
      flex: 1;
      overflow: hidden;
      display: grid;
      place-items: center;
      touch-action: none;
      min-height: 0
    }

    #zc img {
      max-width: 100%;
      max-height: 100%
    }

    #zc iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff
    }

    .pg {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      padding: 12px;
      color: #fff;
      flex: none
    }

    .pg button {
      background: #ffffff1f;
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center
    }

    .star {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: var(--t2);
      background: var(--bg)
    }

    .star.on {
      color: #f5a623
    }

    .star.on svg {
      fill: #f5a623
    }

    .off {
      background: var(--wn);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
      display: none
    }

    .off.on {
      display: inline-block
    }

    .lgi {
      display: block;
      border-radius: 11px;
      flex: none
    }

    .ban {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 16px;
      background: var(--sf);
      border: 1.5px solid var(--ac);
      box-shadow: var(--sh)
    }

    .ban img {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      flex: none
    }

    .ban .in small {
      margin: 2px 0 0
    }

    .cks {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px
    }

    .ck {
      position: relative
    }

    .ck input {
      position: absolute;
      opacity: 0;
      margin: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: pointer
    }

    .ck span {
      display: block;
      text-align: center;
      padding: 11px 4px;
      border: 1.5px solid var(--bd);
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      background: var(--bg)
    }

    .ck input:checked+span {
      background: var(--ac);
      border-color: var(--ac);
      color: #fff
    }

    .sws {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 4px 0 10px
    }

    .sws button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid var(--sf);
      box-shadow: 0 0 0 2px var(--bd);
      display: grid;
      place-items: center;
      color: #fff
    }

    .sws button.on {
      box-shadow: 0 0 0 3px var(--tx)
    }

    #lk {
      position: fixed;
      inset: 0;
      z-index: 400;
      background: var(--g);
      color: #fff;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: calc(24px + var(--sat)) 24px calc(24px + var(--sab));
      user-select: none
    }

    #lk.on {
      display: flex
    }

    .dots {
      display: flex;
      gap: 16px;
      margin: 8px 0 12px
    }

    .dots i {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #fff;
      display: block
    }

    .dots i.f {
      background: #fff
    }

    .pad {
      display: grid;
      grid-template-columns: repeat(3, 72px);
      gap: 14px
    }

    .pad button {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #ffffff22;
      color: #fff;
      font-size: 26px;
      font-weight: 600;
      display: grid;
      place-items: center
    }

    .pad button:active {
      background: #ffffff4d
    }

    .shake {
      animation: shk .35s
    }

    @keyframes shk {
      25% {
        transform: translateX(-10px)
      }

      75% {
        transform: translateX(10px)
      }
    }
    /* ---- v3: pull to refresh, front/back slots ---- */
    #ptr {
      position: fixed;
      top: calc(var(--sat) + 56px);
      left: 50%;
      width: 40px;
      height: 40px;
      margin-left: -20px;
      border-radius: 50%;
      background: var(--sf);
      color: var(--ac);
      box-shadow: var(--sh);
      display: grid;
      place-items: center;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-60px)
    }

    .slots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px
    }

    .slot {
      position: relative;
      min-height: 124px;
      border: 2px dashed var(--ac);
      border-radius: 14px;
      background: color-mix(in srgb, var(--ac) 5%, transparent);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 28px 8px 10px;
      overflow: hidden
    }

    .slot.has {
      border-style: solid;
      padding: 0;
      background: var(--bg)
    }

    .slot img {
      width: 100%;
      height: 124px;
      object-fit: cover;
      display: block
    }

    .slot .pdf {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 28px 10px 10px;
      color: var(--t2);
      max-width: 100%
    }

    .slot .pdf small {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .sl-l {
      position: absolute;
      top: 8px;
      left: 10px;
      font-size: 12px;
      font-weight: 800;
      color: var(--ac);
      z-index: 1
    }

    .slot.has .sl-l {
      background: var(--ac);
      color: #fff;
      padding: 2px 9px;
      border-radius: 10px;
      top: 8px;
      left: 8px
    }

    .sl-b {
      display: flex;
      gap: 8px
    }

    .sl-b button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 14px;
      border-radius: 10px;
      background: var(--sf);
      color: var(--ac);
      font-size: 12px;
      font-weight: 700;
      box-shadow: var(--sh)
    }

    .sl-x {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #000a;
      color: #fff;
      display: grid;
      place-items: center;
      z-index: 2
    }

    .pgb {
      display: flex;
      gap: 8px;
      margin-bottom: 10px
    }

    .pgb button {
      flex: 1;
      white-space: nowrap;
      padding-left: 8px;
      padding-right: 8px
    }

    .two > * {
      min-width: 0
    }

    input[type=date] {
      min-width: 0;
      max-width: 100%
    }
    /* ---------- v3.1 password vault ---------- */
    .tabs button { padding: 4px 8px }
    .vav { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; flex: none; color: #fff; font-weight: 800; font-size: 19px }
    .vtag { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; background: color-mix(in srgb, var(--ac) 10%, transparent); color: var(--ac) }
    .vqa { display: flex; gap: 6px; flex: none }
    .vib { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; flex: none; color: var(--t2); background: var(--bg); border: 1px solid var(--bd) }
    .vib:active { transform: scale(.94) }
    .vlock { text-align: center; padding: 34px 22px }
    .vlock .big { width: 76px; height: 76px; border-radius: 24px; background: var(--g); color: #fff; display: grid; place-items: center; margin: 0 auto 16px; box-shadow: 0 10px 24px color-mix(in srgb, var(--ac) 35%, transparent) }
    .vlock h3 { margin: 0 0 6px; font-size: 20px }
    .vlock p { color: var(--t2); margin: 0 0 16px; line-height: 1.5 }
    .vlock ul { text-align: left; color: var(--t2); padding-left: 20px; margin: 0 0 20px; line-height: 1.7; font-size: 14px }
    .vrow { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--bd) }
    .vrow .rb b.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .4px }
    .vact { display: flex; gap: 8px; margin-top: 14px }
    .vact .btn { flex: 1; padding: 10px 8px }
    .vmeta { font-size: 12px; color: var(--t2); margin: 14px 0 0; line-height: 1.6 }
    .vmeta.wn { color: var(--wn) }
    .vmeter { height: 5px; border-radius: 3px; background: var(--bd); overflow: hidden; margin: -4px 0 4px }
    .vmeter i { display: block; height: 100%; width: 0; transition: width .2s, background .2s }
    .vml { font-size: 12px; color: var(--t2); display: block; margin-bottom: 10px; min-height: 16px }
    .vgen { margin: 0 0 12px }
    .cf { display: grid; grid-template-columns: 1fr 1fr 36px 36px; gap: 6px; margin-bottom: 8px; align-items: center }
    .cf input { margin: 0; padding: 10px 11px; font-size: 14px }
    .vpre { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 4px }
    .vpre button { padding: 6px 11px; border-radius: 16px; border: 1.5px dashed var(--bd); font-size: 12.5px; font-weight: 600; color: var(--t2) }

    /* =====================================================================
       v5 "WALLET" DESIGN: soft tinted canvas, big rounded tiles, pill nav,
       display type for numbers and titles. Accent colour drives the whole UI.
       ===================================================================== */
    :root {
      --bg: color-mix(in srgb, var(--ac) 5%, #f4f5f9);
      --sf: #ffffff;
      --tx: #10131c;
      --t2: #646e84;
      --bd: #e5e8f0;
      --hd: #0d1120;
      --ok: #0e9f6e;
      --wn: #d97706;
      --er: #e0364a;
      --fd: "Bricolage Grotesque", "Figtree", Inter, system-ui, sans-serif;
      --sh: 0 1px 2px #10142010, 0 12px 28px -16px #1014203a;
      --sh2: 0 24px 56px -20px #10142066, 0 4px 12px #1014201a;
      color-scheme: light
    }

    [data-t=dark] {
      --bg: #0a0c12;
      --sf: #141821;
      --tx: #f2f4fa;
      --t2: #8f99ae;
      --bd: #232938;
      --hd: #0a0d18;
      --sh: 0 1px 0 #ffffff08 inset;
      --sh2: 0 24px 56px -20px #000d, 0 4px 14px #0008;
      color-scheme: dark
    }

    body { font-family: Figtree, Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15.5px; line-height: 1.45; -webkit-font-smoothing: antialiased }
    h1, h2, h3 { font-family: var(--fd); letter-spacing: -.03em; font-weight: 700 }
    b { font-weight: 650 }
    :focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; border-radius: 10px }
    input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 0 }

    /* ---- controls ---- */
    .card { border: 0; border-radius: 26px; padding: 20px; box-shadow: var(--sh) }
    input, select, textarea { background: color-mix(in srgb, var(--tx) 5%, var(--sf)); border: 1.5px solid transparent; border-radius: 16px; padding: 14px 16px }
    input:hover, select:hover, textarea:hover { background: color-mix(in srgb, var(--tx) 7%, var(--sf)) }
    input:focus, select:focus, textarea:focus { background: var(--sf); border-color: var(--ac); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ac) 16%, transparent) }
    .lb { font-size: 13px; font-weight: 650; color: var(--t2); margin-bottom: 6px }
    .btn { border-radius: 999px; background: var(--ac); padding: 14px 24px; font-weight: 650; letter-spacing: -.005em; box-shadow: 0 14px 24px -14px color-mix(in srgb, var(--ac) 90%, #000) }
    .btn:hover { filter: brightness(1.07) }
    .btn.sm { padding: 9px 17px; border-radius: 999px }
    .btn.sec { background: color-mix(in srgb, var(--tx) 7%, transparent); color: var(--tx); border: 0; box-shadow: none }
    .btn.sec:hover { filter: none; background: color-mix(in srgb, var(--tx) 11%, transparent) }
    .btn.dg { background: var(--er); box-shadow: 0 14px 24px -14px var(--er) }
    .ib { border-radius: 50%; background: color-mix(in srgb, var(--tx) 7%, transparent); border: 0; width: 36px; height: 36px }
    .star { border-radius: 50%; background: color-mix(in srgb, var(--tx) 7%, transparent); width: 36px; height: 36px }
    .chips { gap: 8px; margin-bottom: 14px }
    .chip { border: 0; border-radius: 999px; background: var(--sf); box-shadow: var(--sh); padding: 9px 17px; font-weight: 650; font-size: 14px }
    .chip { display: inline-flex; align-items: center; gap: 6px }
    .chip.on { background: var(--tx); color: var(--bg) }
    .seg { background: color-mix(in srgb, var(--tx) 7%, transparent); border-radius: 999px }
    .seg button { border-radius: 999px }
    .seg .on { background: var(--sf); color: var(--tx); box-shadow: var(--sh) }
    .bd { border-radius: 999px; padding: 4px 11px; font-weight: 650; font-size: 12.5px; display: inline-flex; align-items: center }
    .bd.er::before, .bd.wn::before, .bd.ok::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 6px }
    .er { background: color-mix(in srgb, var(--er) 13%, transparent) }
    .wn { background: color-mix(in srgb, var(--wn) 15%, transparent) }
    .ok { background: color-mix(in srgb, var(--ok) 13%, transparent) }
    .vb, .vtag { border-radius: 999px }
    .empty { border: 2px dashed var(--bd); border-radius: 26px; background: transparent }
    .bk { font-weight: 650 }

    /* ---- sign in / splash / pin lock ---- */
    #sp, #lk { background: radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--ac) 60%, #0b0e1a), #0b0e1a 70%) }
    .brand { background: color-mix(in srgb, var(--ac) 11%, var(--bg)); color: var(--tx); padding-bottom: 34px }
    .brand h1 { font-family: var(--fd); font-size: 40px; line-height: .98; letter-spacing: -.05em; font-weight: 750; margin-top: 22px }
    .brand p { opacity: 1; color: var(--t2); font-size: 16px; max-width: 30ch }
    .brand .lg, .brand .lgi { background: var(--ac); border-radius: 18px; border: 0 }
    .brand li .i { background: var(--sf); color: var(--ac); border-radius: 12px }
    .auth h1 { font-size: 32px; letter-spacing: -.045em; font-weight: 750 }
    @media(min-width:900px) { .brand h1 { font-size: 64px } .brand { padding: 72px } }

    /* ---- top cap: stays dark so the Android status icons stay readable ---- */
    .tb { background: var(--hd); border-radius: 0 0 26px 26px; box-shadow: none; padding-bottom: 14px }
    .tb b { font-family: var(--fd); font-size: 19px; letter-spacing: -.035em; font-weight: 700 }
    .tb .ib { background: #ffffff1a; color: #fff }

    /* ---- bottom navigation: active item expands into a pill ---- */
    .tabs { left: 0; right: 0; bottom: 0; max-width: none; margin: 0; gap: 2px; border: 0; border-radius: 28px 28px 0 0; background: var(--sf); box-shadow: 0 -14px 34px -16px #10142030; padding: 10px 12px calc(10px + var(--sab)) }
    .tabs button { flex-direction: row; gap: 8px; padding: 11px 14px; border-radius: 999px; font-size: 14px; font-weight: 650; color: var(--t2); transition: background .2s, color .2s }
    .tabs button span { display: none }
    .tabs button.on { background: color-mix(in srgb, var(--ac) 14%, transparent); color: var(--ac) }
    .tabs button.on span { display: inline }
    .tabs .plus { width: 54px; height: 54px; padding: 0; border-radius: 50%; background: var(--tx); color: var(--bg); margin-top: -30px; border: 5px solid var(--bg); box-shadow: var(--sh2) }

    /* ---- desktop sidebar ---- */
    .side { background: var(--sf); border-right: 0; box-shadow: 1px 0 0 var(--bd) }
    .side nav button { border-radius: 999px; font-weight: 650; font-size: 15px }
    .side nav button.on { background: color-mix(in srgb, var(--ac) 13%, transparent); color: var(--ac) }
    .side nav button.on span { display: inline }
    .side .me { color: var(--tx); font-size: 14px; font-weight: 600; background: var(--bg); border: 0; border-radius: 20px }
    .side .me small { color: var(--t2); font-weight: 500 }

    /* ---- page titles ---- */
    .ph h2 { font-size: 36px; letter-spacing: -.05em; font-weight: 750 }
    .h { font-family: var(--fd); font-size: 19px; font-weight: 650; letter-spacing: -.03em; color: var(--tx); text-transform: none; margin: 28px 0 12px }

    /* ---- home: greeting + bento tiles ---- */
    .gh { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 6px 0 20px }
    .gh small { font-size: 15px; color: var(--t2); font-weight: 500 }
    .gh h2 { font-size: 38px; line-height: 1; letter-spacing: -.055em; font-weight: 750; margin-top: 4px }
    .gh .av { width: 56px; height: 56px; font-size: 22px; border: 0; box-shadow: 0 0 0 4px var(--sf) }
    .bento { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px }
    .bt { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; min-height: 124px; padding: 16px 18px; border-radius: 28px; background: var(--sf); box-shadow: var(--sh); text-align: left }
    .bt b { font-family: var(--fd); font-size: 46px; line-height: .95; letter-spacing: -.06em; font-weight: 750 }
    .bt small { font-size: 13.5px; font-weight: 650; color: var(--t2) }
    .bt .ti { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--sf) 70%, transparent) }
    .bt.ta { background: color-mix(in srgb, var(--ac) 13%, var(--sf)) }
    .bt.ta .ti { color: var(--ac) }
    .bt.tb2 { background: color-mix(in srgb, #0ea5a4 14%, var(--sf)) }
    .bt.tb2 .ti { color: #0b8e8d }
    .bt.tw { background: color-mix(in srgb, var(--wn) 15%, var(--sf)) }
    .bt.tw .ti, .bt.tw b { color: var(--wn) }
    .bt.te { background: color-mix(in srgb, var(--er) 13%, var(--sf)) }
    .bt.te .ti, .bt.te b { color: var(--er) }
    .bt.big { grid-column: 1/-1; min-height: 168px; color: #fff; cursor: pointer; background: linear-gradient(150deg, var(--ac), color-mix(in srgb, var(--ac) 62%, #070a18)); box-shadow: 0 26px 40px -24px color-mix(in srgb, var(--ac) 85%, #000) }
    .bt.big::after { content: ""; position: absolute; right: -46px; top: -46px; width: 190px; height: 190px; border-radius: 50%; border: 30px solid #ffffff17; pointer-events: none }
    .bt.big::before { content: ""; position: absolute; right: 26px; top: 26px; width: 58px; height: 58px; border-radius: 50%; border: 12px solid #ffffff12; pointer-events: none }
    .bt.big b { font-size: 84px; color: #fff; letter-spacing: -.07em }
    .bt.big small { color: #ffffffd0; font-size: 14.5px }
    .bt.big p { color: #ffffffe0; font-size: 14px; margin-top: 4px; max-width: 90% }
    .bt.big.good { background: linear-gradient(150deg, var(--ok), color-mix(in srgb, var(--ok) 60%, #04120b)) }
    @media(min-width:900px) { .bento { grid-template-columns: repeat(4, 1fr) } .bt.big { min-height: 190px } }

    /* quick actions: one scrolling row of pills */
    .qa { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 6px; padding: 4px 16px 10px; scrollbar-width: none }
    .qa::-webkit-scrollbar { display: none }
    .qa button { flex: none; flex-direction: row; gap: 8px; padding: 11px 17px; border: 0; border-radius: 999px; background: var(--sf); box-shadow: 0 1px 2px #10142018; color: var(--ac); transition: transform .1s }
    .qa button .i { width: 18px; height: 18px }
    .qa span { font-size: 14px; font-weight: 650; color: var(--tx); white-space: nowrap }
    @media(min-width:900px) { .qa { margin: 0 0 6px; padding: 4px 0 10px; flex-wrap: wrap } }

    /* summary tiles on the profile page */
    .stats { gap: 10px }
    .st { border: 0; border-radius: 22px; padding: 16px 8px 14px; box-shadow: var(--sh); background: var(--sf) }
    .st b { font-family: var(--fd); font-size: 32px; letter-spacing: -.06em; font-weight: 750; line-height: 1 }
    .st small { font-size: 12.5px; font-weight: 600; margin-top: 4px; display: block }
    .st.wn, .st.er, .st.ok { background: var(--sf) }

    /* ---- document and vehicle cards: tinted by status ---- */
    .dc, .vc { border: 0; border-radius: 26px; padding: 14px 16px 14px 14px; gap: 14px; box-shadow: var(--sh); transition: transform .15s, box-shadow .15s }
    .dc:hover, .vc:hover { transform: translateY(-1px); box-shadow: var(--sh2) }
    .dc[data-s=er] { background: color-mix(in srgb, var(--er) 8%, var(--sf)) }
    .dc[data-s=wn] { background: color-mix(in srgb, var(--wn) 9%, var(--sf)) }
    .ic, .vp { width: 54px; height: 54px; border-radius: 19px; background: color-mix(in srgb, var(--ac) 14%, var(--sf)) }
    .ic.er { background: color-mix(in srgb, var(--er) 16%, var(--sf)) }
    .ic.wn { background: color-mix(in srgb, var(--wn) 18%, var(--sf)) }
    .ic.ok { background: color-mix(in srgb, var(--ok) 15%, var(--sf)) }
    .vp { width: 62px; height: 62px; border-radius: 20px }
    .in b { font-family: var(--fd); font-size: 17px; letter-spacing: -.025em; font-weight: 650 }
    .in small { font-size: 13.5px; margin: 3px 0 7px }
    .rt { font-size: 12px; font-weight: 600 }

    /* hero (vehicle details) and profile cover */
    .hero { border-radius: 28px; box-shadow: 0 26px 40px -26px color-mix(in srgb, var(--ac) 85%, #000) }
    .hero h2 { font-size: 30px; letter-spacing: -.05em }
    .hero .btn { background: #fff; color: #10131c; box-shadow: none }
    .cover { border-radius: 26px 26px 0 0 }
    .pfc { border-radius: 26px; padding: 0 }
    .pg2 { height: 8px }

    /* settings rows */
    .grp { padding: 4px 18px }
    .row { padding: 14px 0 }
    .ri { border-radius: 14px; background: color-mix(in srgb, var(--ac) 12%, var(--sf)) }
    .row.rd .ri { background: color-mix(in srgb, var(--er) 14%, var(--sf)) }
    .sw span { background: color-mix(in srgb, var(--tx) 18%, var(--bg)) }

    /* upload */
    .drop, .slot { border-radius: 20px; border-width: 1.5px }
    .slot.has { border-color: var(--bd) }
    .sl-b button { border-radius: 999px }
    .fi { border-radius: 14px }
    .ck span { border: 0; border-radius: 14px; background: color-mix(in srgb, var(--tx) 6%, var(--sf)) }

    /* ---- sheets, dialogs, toast ---- */
    .ov { background: #070a14a8; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px) }
    .md { border-radius: 30px; box-shadow: var(--sh2) }
    .mh h3 { font-size: 21px; letter-spacing: -.04em }
    .mi { border-radius: 16px; background: color-mix(in srgb, var(--ac) 13%, var(--sf)) }
    .mi.er { background: color-mix(in srgb, var(--er) 14%, var(--sf)) }
    .mi.wn { background: color-mix(in srgb, var(--wn) 16%, var(--sf)) }
    .mx { border-radius: 50%; background: color-mix(in srgb, var(--tx) 7%, transparent) }
    .me { border-radius: 14px; background: color-mix(in srgb, var(--er) 11%, transparent) }
    .si { border-radius: 18px }
    .to { border-radius: 999px; padding: 12px 20px; box-shadow: var(--sh2) }
    .lc { border-radius: 26px; box-shadow: var(--sh2) }
    @media(max-width:600px) {
      .md, .md.wide { border-radius: 30px 30px 0 0 }
      .md::before { content: ""; flex: none; width: 42px; height: 5px; border-radius: 5px; background: color-mix(in srgb, var(--tx) 16%, transparent); margin: 10px auto 0 }
    }

    /* ---- vault ---- */
    .vlock .big { border-radius: 30px; background: linear-gradient(150deg, var(--ac), color-mix(in srgb, var(--ac) 62%, #070a18)) }
    .vav { border-radius: 18px }
    .vib { border-radius: 50%; border: 0; background: color-mix(in srgb, var(--tx) 7%, transparent) }
    .ban { border: 0; border-radius: 22px; box-shadow: var(--sh), 0 0 0 1.5px color-mix(in srgb, var(--ac) 50%, transparent) }
    .pad button { background: #ffffff1c; border: 0 }
    #vw nav button, #vw nav a { border-radius: 999px }

    /* toasts sit BELOW the top cap so they are never hidden behind it */
    #ts { top: calc(var(--sat) + 78px); z-index: 500 }
    .to { border: 1px solid color-mix(in srgb, var(--bg) 22%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ac) 28%, transparent), var(--sh2) }
    @media(min-width:900px) { #ts { top: 22px } }

    /* vault folders */
    .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 4px }
    .ftile { position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; min-height: 128px; padding: 16px; border-radius: 28px; text-align: left; background: color-mix(in srgb, var(--c) 13%, var(--sf)); box-shadow: var(--sh); overflow: hidden; transition: transform .12s }
    .ftile:active { transform: scale(.97) }
    .ftile .vav { position: absolute; top: 14px; left: 14px; width: 42px; height: 42px; border-radius: 15px; background: var(--c); font-family: var(--fd) }
    .ftile b { font-family: var(--fd); font-size: 18px; letter-spacing: -.03em; font-weight: 700; overflow-wrap: anywhere }
    .ftile small { font-size: 13px; font-weight: 600; color: var(--t2) }
    .ftile.new { background: transparent; border: 2px dashed var(--bd); box-shadow: none; color: var(--ac); align-items: flex-start; justify-content: center; gap: 4px }
    .ftile.new b { color: var(--tx); font-size: 16px }
    .vtag.vf { background: color-mix(in srgb, var(--tx) 7%, transparent); color: var(--t2) }
    .vtag.vf .i { display: inline; vertical-align: -1px }

    @media(prefers-reduced-motion:reduce) { *, *:before, *:after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important } }
  </style>
</head>

    <span class="lb">Folder</span><select id="vx_fo"><option value="">No folder</option>${vFolders().map(f => `<option value="${f.id}" ${(id ? x.fid : fid0) == f.id ? 'selected' : ''}>${esc(f.title)}</option>`).join('')}</select>
    <div class="two"><div><span class="lb">Category</span><select id="vx_c">${VCAT.map(c => `<option ${(x.cat || 'Other') == c[0] ? 'selected' : ''}>${c[0]}</option>`).join('')}</select></div><div><span class="lb">Website link</span><input id="vx_l" type="url" inputmode="url" placeholder="instagram.com" value="${esc(x.url)}" autocomplete="off" autocapitalize="off"></div></div>
    <span class="lb">Username / ID / Email</span><input id="vx_u" value="${esc(x.user)}" autocomplete="off" autocapitalize="off" spellcheck="false">
    <span class="lb">Password</span><div class="fld">${I('lock', 18)}<input id="vx_p" type="password" value="${esc(x.pass)}" autocomplete="new-password" autocapitalize="off" spellcheck="false"><button type="button" class="eye" onclick="const q=$('#vx_p');q.type=q.type=='password'?'text':'password'" aria-label="Show password">${I('eye', 18)}</button></div>
    <div class="vmeter"><i id="vx_m"></i></div><span class="vml" id="vx_ml"></span>
    <div class="vgen"><button type="button" class="btn sec sm" id="vx_gen">${I('refresh', 16)} Generate strong password</button></div>
    <span class="lb">Notes (optional)</span><textarea id="vx_n" rows="2" style="resize:none" placeholder="Anything else to remember">${esc(x.notes)}</textarea>
    <span class="lb">Related details</span><div id="vx_f"></div>
    <button type="button" class="btn sec sm" id="vx_add">${I('plus', 16)} Add field</button>
    <div class="vpre">${VPRE.map((p, i) => `<button type="button" data-pre="${i}">+ ${p[0]}</button>`).join('')}</div>`,
        onOpen: el => {
          rx(); mt(); $('#vx_p').addEventListener('input', mt);
          el.addEventListener('input', e => { const t = e.target; if (t.dataset.i !== undefined) EX[+t.dataset.i][t.dataset.f] = t.value });
          el.addEventListener('click', e => {
            const b = e.target.closest('button'); if (!b) return;
            const last = () => { const L = $('#vx_f').querySelectorAll('.cf'); const c = L[L.length - 1]; c && c.querySelector(EX[EX.length - 1].k ? '[data-f=v]' : '[data-f=k]').focus() };
            if (b.dataset.x !== undefined) { EX.splice(+b.dataset.x, 1); rx() }
            else if (b.dataset.s !== undefined) { const f = EX[+b.dataset.s]; f.s = !f.s; rx() }
            else if (b.dataset.pre !== undefined) { const p = VPRE[+b.dataset.pre]; EX.push({ k: p[0], v: '', s: !!p[1] }); rx(); last() }
            else if (b.id == 'vx_add') { EX.push({ k: '', v: '', s: false }); rx(); last() }
            else if (b.id == 'vx_gen') { const i = $('#vx_p'); i.value = vGen(); i.type = 'text'; mt() }
          });
          if (!id && !fid0) setTimeout(() => $('#vx_t') && $('#vx_t').focus(), 280)
        },
        pre: el => {
          const t = $('#vx_t').value.trim(), u = $('#vx_u').value.trim(), p = $('#vx_p').value, l = $('#vx_l').value.trim();
          if (!t) return fail(el, 'Enter a title (site or app name)');
          if (l && !vUrl(l)) return fail(el, 'Enter a valid website link, like example.com');
          if (!u && !p) return fail(el, 'Add a username or a password');
          return { title: t, fid: $('#vx_fo').value, cat: $('#vx_c').value, url: l ? vUrl(l) : '', user: u, pass: p, notes: $('#vx_n').value.trim(), extra: EX.filter(e => (e.k || '').trim() || (e.v || '').trim()).map(e => ({ k: (e.k || '').trim(), v: e.v || '', s: !!e.s })) }
        }
      });
      if (!o) return;
      const now = new Date().toISOString(), e = { ...o, id: id || '', fav: !!x.fav, hist: x.hist || [], created: x.created || now, updated: now, pwAt: x.pwAt || x.created || now };
      if (id && x.pass && x.pass != o.pass) { e.hist = [{ p: x.pass, d: now }, ...e.hist].slice(0, 5); e.pwAt = now } else if (!id) e.pwAt = now;
      if (await busy(() => vPut(e), 'Encrypting & saving…')) { go('vault', null, 1); toast(id ? 'Login updated' : 'Login saved') }
    }
    async function vPut(e) {
      const { id, ...r } = e, data = await vSeal(V.key, r), res = await api('vaultSave', { id: id || '', data }), nid = res.id || id;
      const rw = { id: nid, data, updated: r.updated }, i = V.raw.findIndex(z => z.id == nid); if (i < 0) V.raw.push(rw); else V.raw[i] = rw;
      const it = { ...r, id: nid }, j = V.items.findIndex(z => z.id == nid); if (j < 0) V.items.push(it); else V.items[j] = it;
      vCache(); return nid
    }
    async function vFav(id) {
      const x = V.items.find(i => i.id == id); if (!x) return; x.fav = !x.fav; go('vault', null, 1);
      try { await vPut({ ...x }) } catch (e) { x.fav = !x.fav; go('vault', null, 1); toast(e.message, 'er') }
    }
    async function vDel(id) {
      if (await busy(async () => { await api('vaultDelete', { id }); V.raw = V.raw.filter(z => z.id != id); V.items = V.items.filter(z => z.id != id); vCache() }, 'Deleting…')) { go('vault', null, 1); toast('Login deleted') }
    }

    /* ---- vault menu: lock, change master password, export, reset ---- */
    async function vMenu() {
      const k = await sheet('Vault options', [{ k: 'nf', i: 'folder', t: 'New folder', s: 'Group many accounts, like Instagram' }, { k: 'lock', i: 'lock', t: 'Lock vault now' }, { k: 'pw', i: 'key', t: 'Change master password', s: 'Re-encrypts every login' }, { k: 'csv', i: 'download', t: 'Export as CSV', s: 'Not encrypted. Keep the file safe' }, { k: 'rs', i: 'trash', t: 'Reset vault', s: 'Deletes all saved logins', cls: 'rd' }]);
      if (k == 'nf') vFolderForm(); if (k == 'lock') vLock(); if (k == 'pw') vChange(); if (k == 'csv') vExport(); if (k == 'rs') vReset()
    }
    async function vChange() {
      const o = await modal({
        title: 'Change master password', icon: 'key', sticky: 1, ok: 'Change', html: `<span class="lb">Current master password</span>${vPw('vm_a', 'Current', 'off')}<span class="lb">New master password</span>${vPw('vm_b', 'At least 8 characters', 'new-password')}<span class="lb">Confirm new password</span>${vPw('vm_c', 'Type it again', 'new-password')}`,
        pre: el => { if (!$('#vm_a').value) return fail(el, 'Enter your current master password'); if ($('#vm_b').value.length < 8) return fail(el, 'New password must be at least 8 characters'); if ($('#vm_b').value != $('#vm_c').value) return fail(el, 'Passwords do not match'); return { a: $('#vm_a').value, b: $('#vm_b').value } }
      });
      if (!o) return;
      const ok = await busy(async () => {
        const k0 = await vDerive(o.a, s2v(V.meta.salt)); try { await vOpen(k0, V.meta.chk) } catch (e) { throw Error('Current master password is wrong') }
        const d = await api('vaultGet'); V.raw = d.items || []; await vDecryptAll();
        const salt = vRand(16), k = await vDerive(o.b, salt), meta = { v: 1, salt: v2s(salt), chk: await vSeal(k, { ok: 1 }) }, items = [];
        for (const it of V.items) { const { id, ...r } = it; items.push({ id, data: await vSeal(k, r) }) }
        await api('vaultBulk', { meta: JSON.stringify(meta), items });
        V.meta = meta; V.key = k; V.ks = meta.salt; V.raw = items; vCache()
      }, 'Re-encrypting…');
      if (ok) toast('Master password changed')
    }
    function vExport() {
      confirmBox({ title: 'Export passwords?', text: 'The CSV file is <b>not encrypted</b>. Anyone who opens it can read every password. Delete it after use.', ok: 'Export', icon: 'download' }).then(y => {
        if (!y) return;
        const q = v => { let t = String(v ?? ''); if (/^[=+\-@]/.test(t)) t = "'" + t; return '"' + t.replace(/"/g, '""') + '"' },
          R = [['Folder', 'Title', 'Category', 'Website', 'Username', 'Password', 'Notes', 'Related details']];
        vLogins().forEach(x => R.push([(vFol(x) || {}).title || '', x.title, x.cat, x.url, x.user, x.pass, x.notes, (x.extra || []).map(e => e.k + ': ' + e.v).join(' | ')]));
        dl2('nexus-vault-' + new Date().toISOString().slice(0, 10) + '.csv', '\ufeff' + R.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv'); toast('CSV exported', 'inf')
      })
    }
    async function vReset() {
      const o = await modal({ title: 'Reset vault?', icon: 'trash', tone: 'er', danger: 1, sticky: 1, ok: 'Delete everything', html: `<p class="mt" style="margin-bottom:12px">All saved logins will be deleted permanently and the vault returns to its first-time state. Type <b>RESET</b> to confirm.</p><input id="vm_a" placeholder="RESET" autocomplete="off" autocapitalize="characters">`, pre: el => $('#vm_a').value.trim().toUpperCase() == 'RESET' ? true : fail(el, 'Type RESET to confirm') });
      if (o && await busy(async () => { await api('vaultReset'); V.meta = null; V.key = null; V.raw = []; V.items = []; localStorage.removeItem('nxv') }, 'Resetting…')) { go('vault', null, 1); toast('Vault reset', 'inf') }
    }

    /* ---------- v3.2: share / download the actual FILE (not just a link) ---------- */
    const FEXT = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif', 'image/heic': 'heic', 'application/pdf': 'pdf', 'text/plain': 'txt', 'application/msword': 'doc', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document': 'docx', 'application/vnd.ms-excel': 'xls', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': 'xlsx' };
    const fsafe = s => String(s || '').replace(/[\\/:*?"<>|\u0000-\u001f]+/g, '').replace(/\s+/g, ' ').trim().slice(0, 80) || 'document';
    function fileNm(d, f, mime, i) {
      const o = nmOf(f), m = /\.([A-Za-z0-9]{1,5})$/.exec(o), ext = m ? m[1].toLowerCase() : (FEXT[mime] || 'bin'), lb = lbOf(f) || (d.files.length > 1 ? 'Page ' + (i + 1) : '');
      return fsafe(d.title + (lb ? ' - ' + lb : '')) + '.' + ext
    }
    const b2blob = (b, t) => { const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return new Blob([u], { type: t || 'application/octet-stream' }) };
    /* downloads the real bytes from Google Drive through your own backend (only your own files are served) */
    async function fetchFiles(d, list) {
      const out = [];
      for (let k = 0; k < list.length; k++) {
        const f = list[k]; prog(list.length > 1 ? `Preparing file ${k + 1} of ${list.length}…` : 'Preparing file…');
        const r = await api('getFile', { id: f.id }), mime = r.mime && r.mime != 'application/octet-stream' ? r.mime : (f.t || r.mime || 'application/octet-stream');
        out.push({ name: fileNm(d, f, mime, d.files.indexOf(f)), mime, data: r.data })
      }
      return out
    }
    async function pickFiles(d, verb) {
      if (d.files.length < 2) return d.files;
      const k = await sheet(verb + ' which file?', [{ k: 'all', i: 'file', t: 'All pages', s: pgTxt(d.files) }, ...d.files.map((f, i) => ({ k: String(i), i: /^image/.test(f.t || '') ? 'image' : 'file', t: lbOf(f) ? lbOf(f) + ' side' : 'Page ' + (i + 1), s: esc(nmOf(f)) }))]);
      return k == null ? null : k == 'all' ? d.files : [d.files[+k]]
    }
    function webSave(out) { out.forEach((f, i) => setTimeout(() => { const a = document.createElement('a'); a.href = URL.createObjectURL(b2blob(f.data, f.mime)); a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 6000) }, i * 400)) }
    async function nativeFiles(out, title, dlg) {
      const FS = plug('Filesystem'), SH = plug('Share'), uris = [];
      for (const f of out) { const w = await FS.writeFile({ path: 'share/' + Date.now() + '/' + f.name, data: f.data, directory: 'CACHE', recursive: true }); uris.push(w.uri) }
      await SH.share({ title, files: uris, dialogTitle: dlg })
    }
    async function docFiles(d, mode) {
      const list = await pickFiles(d, mode == 'share' ? 'Share' : 'Download'); if (!list) return;
      await sendFiles(d, list, mode)
    }
    async function sendFiles(d, list, mode) {
      const out = await busy(() => fetchFiles(d, list)); if (!out) return;
      const nat = NATIVE() && plug('Filesystem') && plug('Share');
      try {
        if (nat) { await nativeFiles(out, d.title, mode == 'share' ? 'Share file' : 'Save file'); return }
        if (mode == 'share') {
          const fl = out.map(f => new File([b2blob(f.data, f.mime)], f.name, { type: f.mime }));
          if (navigator.canShare && navigator.canShare({ files: fl })) {
            try { await navigator.share({ files: fl, title: d.title }) }
            catch (e) { // the browser wants a fresh tap after a slow download: ask for one
              if (e && e.name == 'NotAllowedError') { const go2 = await modal({ icon: 'share', title: 'File is ready', ok: 'Share now', sticky: 1, noFocus: 1, html: `<p class="mt">${esc(fl.map(f => f.name).join(', '))}</p>`, pre: () => { navigator.share({ files: fl, title: d.title }).catch(() => { }); return true } }); return }
              throw e
            }
            return
          }
          webSave(out); toast('Sharing files is not supported here. Downloaded instead', 'inf'); return
        }
        webSave(out); toast(out.length > 1 ? 'Downloading ' + out.length + ' files' : 'Downloading file')
      } catch (e) { if (!(e && (e.name == 'AbortError' || /cancel/i.test(e.message || '')))) toast('Could not ' + (mode == 'share' ? 'share' : 'save') + ' the file', 'er') }
    }
    function vShare() {
      const p = VP[vi]; if (!p || !p.id) return;
      sendFiles({ title: $('#vt').textContent, files: VP.map(x => x.f).filter(Boolean) }, [p.f], 'share')
    }

    /* ---------- INIT ---------- */
    document.documentElement.dataset.t = localStorage.th || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
    $('#tc').content = document.documentElement.dataset.t == 'dark' ? '#0b0f15' : '#0b1220'; barTheme();
    setTimeout(hideSplash, 7000);
    $('#sp img').src = LOGO; applyAc();
    let Q = new URLSearchParams(location.search).get('a') || '';
    if (Q == 'expiring' || Q == 'veh') { S.tab = Q == 'veh' ? 'veh' : 'docs'; Q = '' }
    try { history.replaceState(null, '', location.pathname) } catch (e) { }
    S.token ? load('sk') : authView('login');
    if (S.token && localStorage.nxpin) lockNow();
  </script>
</body>
